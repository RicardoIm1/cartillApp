<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="common/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <base target="_top" />

    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <style>
        /* ============================================================
       ESTILOS ESPECÍFICOS DEL LOGIN - ESTILO JUGUETE 80'S
       ============================================================ */

        /* ============================================================
       VARIABLES - Heredan del theme principal
       ========================================================== */
        :root {
            --bg-primary: #141E30;
            --container-bg: #1c2541;
            --container-shadow-dark: #0d1320;
            --container-shadow-light: #2b3f60;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.9);
            --text-muted: rgba(255, 255, 255, 0.6);
            --text-muted-light: rgba(255, 255, 255, 0.4);
            --input-bg: #1c2541;
            --input-shadow-dark: #0d1320;
            --input-shadow-light: #2b3f60;
            --input-focus-bg: #243b55;
            --input-placeholder: rgba(255, 255, 255, 0.5);
            --btn-primary: #4361ee;
            --btn-primary-hover: #3a56d4;
            --btn-primary-shadow-dark: #2b3f60;
            --btn-primary-shadow-light: #3a56d4;
            --error-color: #f72585;
            --footer-color: rgba(255, 255, 255, 0.5);
            --border-color: rgba(255, 255, 255, 0.06);
            --card-bg: rgba(255, 255, 255, 0.02);
            --label-color: rgba(255, 255, 255, 0.7);
            --shadow-deep: 8px 8px 16px var(--container-shadow-dark),
                -8px -8px 16px var(--container-shadow-light);
            --shadow-float: 12px 12px 24px var(--container-shadow-dark),
                -12px -12px 24px var(--container-shadow-light);
            --shadow-inset: inset 4px 4px 8px var(--container-shadow-dark),
                inset -4px -4px 8px var(--container-shadow-light);
            --shadow-pressed: inset 4px 4px 10px var(--container-shadow-dark),
                inset -4px -4px 10px var(--container-shadow-light);
            --shadow-btn-primary: 4px 4px 8px var(--btn-primary-shadow-dark),
                -4px -4px 8px var(--btn-primary-shadow-light);
        }

        body.light-mode {
            --bg-primary: #e0e5ec;
            --container-bg: #e8ecf4;
            --container-shadow-dark: #b8bcc8;
            --container-shadow-light: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: rgba(0, 0, 0, 0.8);
            --text-muted: rgba(0, 0, 0, 0.5);
            --text-muted-light: rgba(0, 0, 0, 0.3);
            --input-bg: #e8ecf4;
            --input-shadow-dark: #b8bcc8;
            --input-shadow-light: #ffffff;
            --input-focus-bg: #d5dbe8;
            --input-placeholder: rgba(0, 0, 0, 0.4);
            --btn-primary: #4361ee;
            --btn-primary-hover: #3a56d4;
            --btn-primary-shadow-dark: #2a3f8a;
            --btn-primary-shadow-light: #6b8aff;
            --error-color: #e63946;
            --footer-color: rgba(0, 0, 0, 0.5);
            --border-color: rgba(0, 0, 0, 0.06);
            --card-bg: rgba(255, 255, 255, 0.5);
            --label-color: rgba(0, 0, 0, 0.7);
            --shadow-deep: 8px 8px 16px var(--container-shadow-dark),
                -8px -8px 16px var(--container-shadow-light);
            --shadow-float: 12px 12px 24px var(--container-shadow-dark),
                -12px -12px 24px var(--container-shadow-light);
            --shadow-inset: inset 4px 4px 8px var(--container-shadow-dark),
                inset -4px -4px 8px var(--container-shadow-light);
            --shadow-pressed: inset 4px 4px 10px var(--container-shadow-dark),
                inset -4px -4px 10px var(--container-shadow-light);
            --shadow-btn-primary: 4px 4px 8px var(--btn-primary-shadow-dark),
                -4px -4px 8px var(--btn-primary-shadow-light);
        }

        /* ============================================================
       RESET BODY - FONDO UNIFORME
       ========================================================== */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow: hidden;
            background: linear-gradient(145deg, var(--bg-primary), var(--container-bg));
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            transition: background 0.5s ease, color 0.3s ease;
        }

        /* ============================================================
       CLAYMORPHISM CONTAINER - PLACA PRINCIPAL CON RELIEVE
       ========================================================== */
        .glass-container {
            background: var(--container-bg);
            border-radius: 24px;
            padding: 2.5rem;
            width: 440px;
            max-width: 100%;
            animation: fadeIn 0.6s ease-out 0.4s both;
            position: relative;
            z-index: 1;
            box-shadow: var(--shadow-deep);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.4s ease, box-shadow 0.4s ease;
        }

        body.light-mode .glass-container {
            box-shadow: var(--shadow-deep);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
       LOGO - CON RELIEVE
       ========================================================== */
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo svg {
            height: 60px;
            filter: drop-shadow(2px 2px 6px rgba(0, 0, 0, 0.3));
        }

        /* ============================================================
       TÍTULO DEL LOGIN - CON RELIEVE
       ========================================================== */
        .login-title {
            text-align: center;
            margin-bottom: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            font-size: 1.8rem;
            transition: color 0.3s ease;
            text-shadow: 2px 2px 4px var(--container-shadow-dark);
        }

        body.light-mode .login-title {
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.05);
        }

        /* ============================================================
       FORMULARIO - INPUTS CON RELIEVE INTERNO
       ========================================================== */
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--label-color);
            transition: color 0.3s ease;
            font-size: 0.85rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem 1.2rem;
            border: none;
            border-radius: 14px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-inset);
            font-family: 'Poppins', sans-serif;
        }

        .form-group input:focus {
            outline: none;
            background: var(--input-focus-bg);
            box-shadow: var(--shadow-pressed),
                0 0 0 3px rgba(67, 97, 238, 0.15);
        }

        .form-group input::placeholder {
            color: var(--text-muted-light);
            transition: color 0.3s ease;
        }

        /* ============================================================
       BOTÓN DE LOGIN - PLACA CON RELIEVE PROFUNDO
       ========================================================== */
        .btn-login {
            width: 100%;
            padding: 1rem 1.5rem;
            margin-top: 0.5rem;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: var(--btn-primary);
            color: white;
            box-shadow: var(--shadow-btn-primary);
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover:not(:disabled) {
            background: var(--btn-primary-hover);
            transform: translateY(-3px);
            box-shadow: var(--shadow-float);
        }

        .btn-login:active:not(:disabled) {
            transform: translateY(2px) scale(0.97);
            box-shadow: var(--shadow-pressed);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ============================================================
       LOADING SPINNER
       ========================================================== */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
       ERROR - CON RELIEVE
       ========================================================== */
        .error {
            color: var(--error-color);
            margin-top: 1rem;
            text-align: center;
            font-weight: 500;
            animation: shake 0.5s ease;
            min-height: 2rem;
            transition: color 0.3s ease;
            padding: 0.5rem;
            border-radius: 12px;
            background: rgba(247, 37, 133, 0.06);
            box-shadow: var(--shadow-inset);
        }

        body.light-mode .error {
            background: rgba(230, 57, 70, 0.06);
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-6px);
            }

            40%,
            80% {
                transform: translateX(6px);
            }
        }

        /* ============================================================
       FOOTER DEL LOGIN
       ========================================================== */
        .login-footer {
            text-align: center;
            margin-top: 2rem;
            color: var(--footer-color);
            font-size: 0.85rem;
            transition: color 0.3s ease;
            padding: 0.5rem 0;
            border-top: 1px solid var(--border-color);
        }

        .login-footer a {
            color: var(--btn-success, #4cc9f0);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        /* ============================================================
       THEME TOGGLE - BOTÓN FLOTANTE CON RELIEVE
       ========================================================== */
        .theme-toggle {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 100;
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: var(--container-bg);
            backdrop-filter: blur(8px);
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: var(--shadow-float);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        body.light-mode .theme-toggle {
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: var(--shadow-float);
        }

        .theme-toggle:active {
            transform: scale(0.92);
            box-shadow: var(--shadow-pressed);
        }

        /* ============================================================
       PARTÍCULAS - Versión ligera
       ========================================================== */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--particle-color, rgba(255, 255, 255, 0.04));
            animation: floatParticle linear infinite;
            will-change: transform;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }

            10% {
                opacity: 0.6;
            }

            90% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-110vh) translateX(50px) scale(0.5);
                opacity: 0;
            }
        }

        /* ============================================================
       RESPONSIVE
       ========================================================== */
        @media (max-width: 992px) {
            .glass-container {
                padding: 2rem;
                width: 90vw;
            }

            .login-title {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            .glass-container {
                padding: 1.5rem;
                border-radius: 20px;
            }

            .login-title {
                font-size: 1.3rem;
                margin-bottom: 1.5rem;
            }

            .form-group input {
                padding: 0.8rem 1rem;
                font-size: 0.9rem;
                border-radius: 12px;
            }

            .btn-login {
                padding: 0.8rem 1.2rem;
                font-size: 0.85rem;
                border-radius: 12px;
            }

            .theme-toggle {
                top: 1rem;
                right: 1rem;
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .logo svg {
                height: 45px;
            }

            .login-footer {
                font-size: 0.75rem;
            }
        }

        @media (max-width: 400px) {
            body {
                padding: 0.5rem;
            }

            .glass-container {
                padding: 1rem;
                border-radius: 16px;
                width: 100%;
            }

            .login-title {
                font-size: 1.1rem;
                margin-bottom: 1rem;
            }

            .form-group {
                margin-bottom: 1rem;
            }

            .form-group input {
                padding: 0.6rem 0.8rem;
                font-size: 0.85rem;
                border-radius: 10px;
            }

            .btn-login {
                padding: 0.6rem 1rem;
                font-size: 0.8rem;
                border-radius: 10px;
            }

            .theme-toggle {
                top: 0.5rem;
                right: 0.5rem;
                width: 34px;
                height: 34px;
                font-size: 1rem;
            }

            .logo svg {
                height: 35px;
            }

            .login-footer {
                font-size: 0.65rem;
                margin-top: 1rem;
            }
        }

        @media (max-height: 700px) {
            .glass-container {
                padding: 1.5rem;
            }

            .logo {
                margin-bottom: 1rem;
            }

            .logo svg {
                height: 40px;
            }

            .login-title {
                font-size: 1.3rem;
                margin-bottom: 1rem;
            }

            .form-group {
                margin-bottom: 0.8rem;
            }

            .form-group input {
                padding: 0.6rem 0.8rem;
            }

            .btn-login {
                padding: 0.6rem 1rem;
                margin-top: 0.3rem;
            }

            .login-footer {
                margin-top: 1rem;
                padding: 0.3rem 0;
            }
        }
    </style>
</head>

<body>
    <div class="particles" id="particles"></div>

    <form id="loginForm" onsubmit="login(event);">
        <div class="glass-container">
            <!-- Botón para cambiar tema -->
            <button class="theme-toggle" id="themeToggle" type="button" title="Cambiar tema">
                🌙
            </button>

            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="60px"
                    height="60px">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
                </svg>
            </div>

            <h2>Iniciar Sesión</h2>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required autocomplete="email" />
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" required
                    autocomplete="current-password" />
            </div>

            <button type="submit" class="btn" id="loginBtn">
                <span id="btnText">Ingresar</span>
                <span id="btnLoader" class="loading" style="display: none;"></span>
            </button>

            <div id="error" class="error"></div>

            <div class="footer">
                Sistema de Cartillas de Salud © <span id="currentYear"></span>
            </div>
        </div>
    </form>

    <script>
        // ============================================================
        // FUNCIONALIDAD DIURNO / NOCTURNO
        // ============================================================

        (function setupTheme() {
            var body = document.body;
            var themeToggle = document.getElementById('themeToggle');
            var icon = themeToggle;

            // Cargar tema guardado
            var savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                body.classList.add('light-mode');
                icon.textContent = '☀️';
            } else {
                icon.textContent = '🌙';
            }

            // Cambiar tema al hacer clic
            themeToggle.addEventListener('click', function () {
                var isLight = body.classList.toggle('light-mode');
                if (isLight) {
                    icon.textContent = '☀️';
                    localStorage.setItem('theme', 'light');
                } else {
                    icon.textContent = '🌙';
                    localStorage.setItem('theme', 'dark');
                }
            });
        })();

        // ============================================================
        // CONFIGURACIÓN DE SUPABASE
        // ============================================================
        var SUPABASE_URL = 'https://apsvmojzniglbpmmaugd.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_m9qYl2tQZMAou80wO2g66Q_VUzkf3n1';

        var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // FUNCIONES DE AUTENTICACIÓN
        // ============================================================

        async function login(event) {
            event.preventDefault();

            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const errorElement = document.getElementById('error');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const loginBtn = document.getElementById('loginBtn');

            if (errorElement) {
                errorElement.textContent = '';
                errorElement.style.display = 'block';
            }

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                if (errorElement) {
                    errorElement.textContent = 'Por favor completa todos los campos';
                }
                return;
            }

            if (btnText) btnText.textContent = 'Autenticando...';
            if (btnLoader) btnLoader.style.display = 'inline-block';
            if (loginBtn) loginBtn.disabled = true;

            try {
                const {data, error} = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    throw error;
                }

                if (data && data.user) {
                    localStorage.setItem('supabase_user', JSON.stringify(data.user));
                    localStorage.setItem('supabase_session', JSON.stringify(data.session));

                    const container = document.querySelector('.glass-container');
                    if (container) {
                        container.style.animation = 'fadeOut 0.5s ease forwards';
                    }

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                }

            } catch (error) {
                if (btnText) btnText.textContent = 'Ingresar';
                if (btnLoader) btnLoader.style.display = 'none';
                if (loginBtn) loginBtn.disabled = false;

                if (errorElement) {
                    let mensaje = 'Error al iniciar sesión';
                    if (error.message) {
                        if (error.message.includes('Invalid login credentials')) {
                            mensaje = 'Correo o contraseña incorrectos';
                        } else if (error.message.includes('Email not confirmed')) {
                            mensaje = 'Tu correo aún no ha sido confirmado. Revisa tu bandeja de entrada.';
                        } else if (error.message.includes('Too many requests')) {
                            mensaje = 'Demasiados intentos. Espera un momento y vuelve a intentarlo.';
                        } else {
                            mensaje = error.message;
                        }
                    }
                    errorElement.textContent = mensaje;
                    errorElement.style.display = 'block';
                }

                console.error('Error en autenticación:', error);
            }
        }

        // ============================================================
        // FUNCIONES AUXILIARES (Partículas, año, etc.)
        // ============================================================

        document.getElementById('currentYear').textContent = new Date().getFullYear();

        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 15;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');

                const size = Math.random() * 10 + 5;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.bottom = '-' + size + 'px';
                particle.style.animationDuration = Math.random() * 20 + 10 + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.1;

                particlesContainer.appendChild(particle);
            }
        }

        window.addEventListener('load', function () {
            createParticles();

            document.querySelectorAll('input').forEach(function (input) {
                input.addEventListener('mouseenter', function () {
                    input.style.transform = 'scale(1.02)';
                });
                input.addEventListener('mouseleave', function () {
                    input.style.transform = 'scale(1)';
                });
            });
        });

        // ============================================================
        // FUNCIÓN PARA CERRAR SESIÓN (se usa desde el dashboard)
        // ============================================================

        async function logout() {
            const {error} = await supabase.auth.signOut();
            if (error) {
                console.error('Error al cerrar sesión:', error);
            } else {
                localStorage.removeItem('supabase_user');
                localStorage.removeItem('supabase_session');
                window.location.href = 'login.html';
            }
        }

        window.logout = logout;
    </script>

</body>

</html>
