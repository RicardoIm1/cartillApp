<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Cartillas</title>
    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <!-- CSS Principal - TODOS los estilos base -->
    <link rel="stylesheet" href="common/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <style>
        /* ============================================================
       ESTILOS ESPECÍFICOS DEL DASHBOARD
       ============================================================ */

        /* Reset de body para el dashboard */
        body {
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            height: 100vh;
            overflow-y: hidden;
        }

        /*==========================================================
    DASHBOARD CONTAINER - con altura fija
    ==========================================================*/

        .dashboard-container {
            position: relative;
            display: flex;
            gap: 2.2rem;
            width: 100%;
            max-width: 1450px;
            margin: auto;
            padding: 2rem;
            border-radius: 34px;
            height: calc(100vh - 4rem);
            /* Altura total menos padding de body */
            overflow: hidden;
            /* Evita que el contenido se desborde */
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .06),
                    rgba(255, 255, 255, .02)),
                var(--container-bg);
            backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 255, .05);
            box-shadow:
                inset 2px 2px 5px rgba(255, 255, 255, .06),
                inset -5px -5px 10px rgba(0, 0, 0, .18),
                18px 18px 40px var(--container-shadow-dark),
                -16px -16px 34px var(--container-shadow-light);
        }

        /*==========================================================
    SIDEBAR - altura completa
    ==========================================================*/

        .sidebar {
            width: 240px;
            flex-shrink: 0;
            padding: 1.3rem;
            border-radius: 28px;
            height: 100%;
            /* Ocupa toda la altura del contenedor */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .05),
                    rgba(255, 255, 255, .02)),
                var(--container-bg);
            box-shadow:
                inset 2px 2px 5px rgba(255, 255, 255, .05),
                inset -4px -4px 8px rgba(0, 0, 0, .16),
                8px 8px 22px var(--container-shadow-dark),
                -8px -8px 18px var(--container-shadow-light);
        }

        /* Contenedor del menú con scroll si es necesario */
        .sidebar .menu-grid {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            /* Espacio para el scroll */
        }

        /* Scroll personalizado para el menú */
        .sidebar .menu-grid::-webkit-scrollbar {
            width: 3px;
        }

        .sidebar .menu-grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar .menu-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        /* Cerrar sesión al final del sidebar */
        .sidebar .menu-item.danger {
            margin-top: auto;
            flex-shrink: 0;
        }

        .menu-divider {
            flex-shrink: 0;
        }

        /*==========================================================
    BRAND
    ==========================================================*/

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, .05);
            flex-shrink: 0;
        }

        .logo-icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .14),
                    rgba(255, 255, 255, .02));
            box-shadow:
                inset 2px 2px 5px rgba(255, 255, 255, .12),
                inset -3px -3px 8px rgba(0, 0, 0, .16),
                8px 8px 18px var(--container-shadow-dark),
                -8px -8px 18px var(--container-shadow-light);
            font-size: 1.7rem;
        }

        .sidebar-brand h2 {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .sidebar-brand small {
            display: block;
            margin-top: .25rem;
            color: var(--text-muted);
        }

        /*==========================================================
    MENU
    ==========================================================*/

        .menu-item {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: .9rem;
            width: 100%;
            padding: .95rem 1rem;
            margin-bottom: .65rem;
            border: none;
            border-radius: 18px;
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .04),
                    rgba(255, 255, 255, .01));
            color: var(--text-secondary);
            text-decoration: none;
            cursor: pointer;
            transition: .22s cubic-bezier(.2, .8, .2, 1);
            box-shadow:
                inset 1px 1px 3px rgba(255, 255, 255, .05),
                inset -2px -2px 5px rgba(0, 0, 0, .10);
            flex-shrink: 0;
        }

        /* brillo */
        .menu-item::before {
            content: "";
            position: absolute;
            inset: 3px;
            border-radius: inherit;
            background:
                linear-gradient(180deg,
                    rgba(255, 255, 255, .14),
                    transparent 42%);
            pointer-events: none;
        }

        /* reflejo */
        .menu-item::after {
            content: "";
            position: absolute;
            width: 45%;
            height: 180%;
            top: -45%;
            left: -20%;
            background:
                radial-gradient(ellipse,
                    rgba(255, 255, 255, .22),
                    transparent 70%);
            filter: blur(14px);
            opacity: .45;
        }

        .menu-item:hover {
            transform:
                translateY(-3px) scale(1.01);
            color: white;
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .08),
                    rgba(255, 255, 255, .02));
            box-shadow:
                inset 2px 2px 4px rgba(255, 255, 255, .10),
                inset -3px -3px 8px rgba(0, 0, 0, .08),
                8px 10px 20px var(--container-shadow-dark),
                -8px -8px 16px var(--container-shadow-light);
        }

        .menu-item:active {
            transform:
                translateY(2px) scale(.985);
            box-shadow:
                inset 5px 5px 10px var(--container-shadow-dark),
                inset -5px -5px 10px var(--container-shadow-light);
        }

        .menu-item.active {
            color: white;
            background:
                linear-gradient(145deg,
                    var(--btn-primary),
                    var(--btn-success));
            box-shadow:
                inset 2px 2px 6px rgba(255, 255, 255, .18),
                inset -4px -4px 8px rgba(0, 0, 0, .18),
                0 0 28px rgba(67, 97, 238, .30);
        }

        /*==========================================================
    ICONO
    ==========================================================*/

        .menu-item .icon {
            width: 34px;
            text-align: center;
            font-size: 1.3rem;
            opacity: .95;
        }

        /*==========================================================
    BADGE MENU
    ==========================================================*/

        .badge-menu {
            margin-left: auto;
            padding: .25rem .75rem;
            border-radius: 999px;
            font-size: .65rem;
            font-weight: 700;
            color: white;
            background:
                linear-gradient(145deg,
                    var(--btn-success),
                    var(--btn-primary));
            box-shadow:
                inset 2px 2px 4px rgba(255, 255, 255, .16),
                4px 4px 10px rgba(0, 0, 0, .20);
        }

        /*==========================================================
    MAIN CONTENT - ocupa el espacio restante
    ==========================================================*/

        .main-content {
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /*==========================================================
    USER BADGE
    ==========================================================*/

        .user-badge {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .85rem 1.6rem;
            margin-bottom: 1.5rem;
            border-radius: 999px;
            flex-shrink: 0;
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .08),
                    rgba(255, 255, 255, .02)),
                var(--container-bg);
            border: 1px solid rgba(255, 255, 255, .05);
            box-shadow:
                inset 2px 2px 5px rgba(255, 255, 255, .08),
                inset -3px -3px 8px rgba(0, 0, 0, .12),
                8px 10px 22px var(--container-shadow-dark),
                -8px -8px 18px var(--container-shadow-light);
        }

        .user-badge strong {
            color: var(--btn-success);
            font-weight: 700;
        }

        /*==========================================================
    HEADER
    ==========================================================*/

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 0.5rem;
            padding-right: 3.5rem;
            flex-shrink: 0;
        }

        .dashboard-header h1 {
            font-weight: 600;
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
            transition: color var(--transition-medium);
        }

        .dashboard-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: color var(--transition-medium);
        }

        /*==========================================================
    HEADER ACTIONS
    ==========================================================*/

        .header-actions {
            margin-top: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-shrink: 0;
        }

        .header-actions .info {
            padding: .75rem 1.3rem;
            border-radius: 999px;
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .05),
                    rgba(255, 255, 255, .02));
            box-shadow:
                inset 2px 2px 5px rgba(255, 255, 255, .05),
                inset -3px -3px 6px rgba(0, 0, 0, .12);
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /*==========================================================
    PREMIUM CLAY TABLE - con scroll interno
    ==========================================================*/

        .table-container {
            position: relative;
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 28px;
            overflow: auto;
            flex: 1;
            min-height: 0;
            /* Importante para que flex funcione */
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .05),
                    rgba(255, 255, 255, .02)),
                var(--container-bg);
            border: 1px solid rgba(255, 255, 255, .05);
            backdrop-filter: blur(18px);
            box-shadow:
                inset 2px 2px 5px rgba(255, 255, 255, .06),
                inset -5px -5px 10px rgba(0, 0, 0, .18),
                14px 14px 35px var(--container-shadow-dark),
                -14px -14px 30px var(--container-shadow-light);
        }

        /* Scroll personalizado para la tabla */
        .table-container::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .table-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
        }

        .table-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /*==========================================================*/

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
        }

        /*==========================================================*/

        thead th {
            padding: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: .72rem;
            font-weight: 700;
            /* color: var(--text-muted); */
            color: #f72585;
            border: none;
            position: sticky;
            top: 0;
            z-index: 2;
            background: var(--container-bg);
        }

        /*==========================================================*/

        tbody tr {
            transition: .22s cubic-bezier(.2, .8, .2, 1);
        }

        /*==========================================================*/

        tbody td {
            padding: 1rem;
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .05),
                    rgba(255, 255, 255, .02));
            border: none;
            color: var(--text-secondary);
            position: relative;
        }

        /* esquinas */
        tbody td:first-child {
            border-radius: 18px 0 0 18px;
        }

        tbody td:last-child {
            border-radius: 0 18px 18px 0;
        }

        /*==========================================================*/

        tbody tr:hover {
            transform:
                translateY(-3px) scale(1.004);
        }

        tbody tr:hover td {
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .08),
                    rgba(255, 255, 255, .03));
            box-shadow:
                inset 2px 2px 5px rgba(255, 255, 255, .08),
                inset -4px -4px 8px rgba(0, 0, 0, .10),
                8px 10px 20px rgba(0, 0, 0, .12);
        }

        /*==========================================================*/

        tbody tr:active {
            transform: translateY(2px);
        }

        tbody tr:active td {
            box-shadow:
                inset 5px 5px 10px rgba(0, 0, 0, .18),
                inset -4px -4px 8px rgba(255, 255, 255, .06);
        }

        /*==========================================================
    NUMEROS
    ==========================================================*/

        .cantidad {
            font-size: 1.08rem;
            font-weight: 700;
        }

        /*==========================================================*/

        .cantidad-alta {
            color: #38d39f;
        }

        .cantidad-media {
            color: #ffbe3d;
        }

        .cantidad-baja {
            color: #ff5e7e;
        }

        /*==========================================================
    BADGES
    ==========================================================*/

        .badge-clues {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 64px;
            padding: .45rem .85rem;
            border-radius: 999px;
            font-size: .72rem;
            font-weight: 700;
            color: white;
            background:
                linear-gradient(145deg,
                    var(--btn-success),
                    var(--btn-primary));
            box-shadow:
                inset 2px 2px 5px rgba(255, 255, 255, .18),
                inset -3px -3px 6px rgba(0, 0, 0, .18),
                5px 5px 12px rgba(0, 0, 0, .18);
        }

        /*==========================================================
    LOADING
    ==========================================================*/

        .loading-spinner {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .10);
            border-top-color: var(--btn-primary);
            animation: spin .7s linear infinite;
        }

        /*==========================================================*/

        .empty-state {
            padding: 3rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 1rem;
        }

        /*==========================================================*/

        .error {
            padding: 1rem;
            border-radius: 18px;
            background:
                linear-gradient(145deg,
                    rgba(255, 94, 126, .12),
                    rgba(255, 94, 126, .05));
            color: #ff5e7e;
            font-weight: 600;
        }

        /*==========================================================
    FOOTER
    ==========================================================*/

        .footer {
            text-align: center;
            padding: 1rem 0 0.5rem 0;
            color: var(--footer-color);
            font-size: 0.75rem;
            flex-shrink: 0;
            border-top: 1px solid rgba(255, 255, 255, .04);
            margin-top: 1rem;
        }

        /* ============================================================
       RESPONSIVE DEL DASHBOARD
       ============================================================ */
        @media (max-width: 992px) {
            body {
                height: auto;
                overflow-y: auto;
                padding: 1rem;
            }

            .dashboard-container {
                flex-direction: column;
                padding: 1.5rem;
                height: auto;
                max-height: none;
                overflow: visible;
            }

            .sidebar {
                min-width: 100%;
                max-width: 100%;
                padding-right: 0;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding-bottom: 1rem;
                margin-bottom: 1rem;
                height: auto;
                max-height: 280px;
            }

            .sidebar .menu-grid {
                overflow-y: auto;
                max-height: 180px;
            }

            .sidebar-brand {
                padding: 0 0 0.75rem 0;
                margin-bottom: 0.75rem;
            }

            .menu-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 0.25rem;
            }

            .menu-item {
                padding: 0.5rem 0.75rem;
                font-size: 0.8rem;
                margin-bottom: 0.3rem;
            }

            .menu-item .icon {
                font-size: 1.1rem;
                width: 24px;
            }

            .menu-divider {
                display: none;
            }

            .dashboard-header {
                padding-right: 0;
            }

            .dashboard-header h1 {
                font-size: 1.4rem;
            }

            .main-content {
                height: auto;
                min-height: 400px;
            }

            .table-container {
                min-height: 200px;
                max-height: 500px;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 0.5rem;
                height: auto;
                overflow-y: auto;
            }

            .dashboard-container {
                padding: 0.8rem;
                border-radius: 20px;
                height: auto;
            }

            .sidebar {
                max-height: 200px;
                padding: 0.8rem;
            }

            .sidebar .menu-grid {
                max-height: 120px;
            }

            .sidebar-brand .logo-icon {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .sidebar-brand h2 {
                font-size: 0.95rem;
            }

            .menu-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.2rem;
            }

            .menu-item {
                font-size: 0.7rem;
                padding: 0.35rem 0.5rem;
                border-radius: 12px;
            }

            .menu-item .icon {
                font-size: 0.9rem;
                width: 18px;
            }

            .menu-item::after {
                display: none;
            }

            .dashboard-header h1 {
                font-size: 1.2rem;
            }

            .user-badge {
                font-size: 0.75rem;
                padding: 0.5rem 1rem;
            }

            table {
                font-size: 0.7rem;
                min-width: 400px;
            }

            th,
            td {
                padding: 0.4rem 0.6rem;
            }

            .header-actions {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }

            .header-actions .info {
                font-size: 0.75rem;
                padding: 0.4rem 0.8rem;
                text-align: center;
            }

            .btn-group {
                justify-content: center;
            }

            .badge-clues {
                min-width: 40px;
                padding: 0.2rem 0.5rem;
                font-size: 0.6rem;
            }

            .table-container {
                padding: 0.5rem;
                border-radius: 16px;
                max-height: 350px;
            }
        }

        @media (max-width: 400px) {
            .menu-grid {
                grid-template-columns: 1fr;
            }

            table {
                min-width: 320px;
                font-size: 0.65rem;
            }

            th,
            td {
                padding: 0.3rem 0.4rem;
            }

            .table-container {
                max-height: 280px;
            }
        }

        @media (max-height: 700px) {
            .dashboard-container {
                height: calc(100vh - 2rem);
                padding: 1rem;
                gap: 1rem;
            }

            .sidebar {
                padding: 0.8rem;
            }

            .sidebar-brand {
                margin-bottom: 0.8rem;
                padding-bottom: 0.8rem;
            }

            .sidebar-brand .logo-icon {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .sidebar-brand h2 {
                font-size: 0.9rem;
            }

            .menu-item {
                padding: 0.5rem 0.7rem;
                font-size: 0.75rem;
                margin-bottom: 0.3rem;
            }

            .user-badge {
                padding: 0.4rem 1rem;
                font-size: 0.7rem;
                margin-bottom: 0.5rem;
            }

            .header-actions {
                margin-top: 0.3rem;
            }

            .table-container {
                margin-top: 0.3rem;
                padding: 0.5rem;
            }

            tbody td {
                padding: 0.4rem 0.6rem;
            }
        }

        /* ============================================================
   BUSCADOR UNIVERSAL – CLAYMORPHISM PREMIUM
   ============================================================ */

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1rem;
            flex-shrink: 0;
        }

        .header-actions-right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-shrink: 0;
        }

        /* ============================================================
   SEARCH WRAPPER
   ============================================================ */
        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 200px;
            max-width: 480px;
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .05),
                    rgba(255, 255, 255, .02)),
                var(--container-bg);
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, .05);
            box-shadow:
                inset 2px 2px 5px rgba(255, 255, 255, .05),
                inset -3px -3px 6px rgba(0, 0, 0, .12),
                6px 6px 14px var(--container-shadow-dark),
                -6px -6px 12px var(--container-shadow-light);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .search-wrapper:focus-within {
            box-shadow:
                inset 2px 2px 5px rgba(255, 255, 255, .08),
                inset -3px -3px 6px rgba(0, 0, 0, .10),
                0 0 0 3px rgba(67, 97, 238, .15),
                8px 8px 20px var(--container-shadow-dark),
                -8px -8px 18px var(--container-shadow-light);
            border-color: rgba(67, 97, 238, .2);
        }

        /* ============================================================
   ICONO DE BÚSQUEDA
   ============================================================ */
        .search-icon {
            position: absolute;
            left: 1rem;
            font-size: 1rem;
            opacity: 0.5;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .search-wrapper:focus-within .search-icon {
            opacity: 0.8;
        }

        /* ============================================================
   INPUT DE BÚSQUEDA
   ============================================================ */
        .search-input {
            width: 100%;
            padding: 0.85rem 3.2rem 0.85rem 3rem;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            outline: none;
            border-radius: 999px;
            font-family: 'Poppins', sans-serif;
            transition: color 0.3s ease;
        }

        .search-input::placeholder {
            color: var(--text-muted-light);
            font-weight: 400;
        }

        /* ============================================================
   BOTÓN DE LIMPIAR
   ============================================================ */
        .search-clear {
            position: absolute;
            right: 3.2rem;
            display: none;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 50%;
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .08),
                    rgba(255, 255, 255, .02));
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.2s ease;
            box-shadow:
                inset 1px 1px 3px rgba(255, 255, 255, .05),
                inset -2px -2px 4px rgba(0, 0, 0, .10);
        }

        .search-clear.visible {
            display: flex;
        }

        .search-clear:hover {
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .14),
                    rgba(255, 255, 255, .04));
            color: var(--text-primary);
            transform: scale(1.1);
        }

        .search-clear:active {
            transform: scale(0.9);
        }

        /* ============================================================
   SHORTCUT (⌘K)
   ============================================================ */
        .search-shortcut {
            position: absolute;
            right: 0.8rem;
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
            font-size: 0.6rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            color: var(--text-muted-light);
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .04),
                    rgba(255, 255, 255, .01));
            border: 1px solid rgba(255, 255, 255, .04);
            box-shadow:
                inset 1px 1px 2px rgba(255, 255, 255, .04),
                inset -1px -1px 2px rgba(0, 0, 0, .06);
            pointer-events: none;
            letter-spacing: 0.3px;
        }

        /* ============================================================
   RESPONSIVE
   ============================================================ */
        @media (max-width: 768px) {
            .header-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .search-wrapper {
                max-width: 100%;
                min-width: auto;
            }

            .search-shortcut {
                display: none;
            }

            .header-actions-right {
                justify-content: space-between;
            }
        }

        @media (max-width: 480px) {
            .search-input {
                font-size: 0.8rem;
                padding: 0.7rem 2.5rem 0.7rem 2.5rem;
            }

            .search-icon {
                left: 0.7rem;
                font-size: 0.85rem;
            }

            .search-clear {
                right: 0.7rem;
                width: 20px;
                height: 20px;
                font-size: 0.6rem;
            }

            .header-actions-right .info {
                font-size: 0.7rem;
                padding: 0.3rem 0.6rem;
            }

            .header-actions-right .btn {
                font-size: 0.7rem;
                padding: 0.4rem 0.8rem;
            }
        }
    </style>
</head>

<body>

    <!-- Partículas -->
    <div class="particles" id="particles"></div>

    <div class="dashboard-container" id="app">
        <!-- Botón de tema -->
        <button class="theme-toggle" id="themeToggle" type="button" title="Cambiar tema">
            🌙
        </button>

        <!-- ============================================================
        MENÚ LATERAL
        ============================================================ -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="logo-icon">📋</span>
                <h2>Cartillas <small>Control de Salud</small></h2>
            </div>

            <nav class="menu-grid">
                <a href="dashboard.html" class="menu-item active">
                    <span class="icon">📊</span> Dashboard
                </a>
                <a href="traspasos.html" class="menu-item">
                    <span class="icon">🔄</span> Traspasos
                </a>
                <a href="censo.html" class="menu-item">
                    <span class="icon">📝</span> Censo
                </a>
                <a href="reportes.html" class="menu-item">
                    <span class="icon">📄</span> Reportes
                </a>
                <a href="usuarios.html" class="menu-item">
                    <span class="icon">👥</span> Usuarios
                </a>
                <a href="registro_usuarios.html" class="menu-item">
                    <span class="icon">➕</span> Registrar
                </a>
                <a href="tickets.html" class="menu-item">
                    <span class="icon">🎫</span> Tickets
                </a>
                <a href="contactos.html" class="menu-item">
                    <span class="icon">📬</span> Contactos
                </a>
            </nav>

            <div class="menu-divider"></div>

            <button class="menu-item" onclick="logout()" style="color:var(--btn-danger);">
                <span class="icon">🚪</span> Cerrar Sesión
            </button>
        </aside>

        <!-- ============================================================
        CONTENIDO PRINCIPAL
        ============================================================ -->
        <main class="main-content">
            <!-- HEADER -->
            <div class="dashboard-header">
                <div>
                    <h1>📋 Panel de Control</h1>
                    <p class="subtitle">Sistema de Control de Cartillas</p>
                </div>
            </div>

            <!-- INFO USUARIO -->
            <div id="userInfo">
                <div class="user-badge">
                    <span id="userName">Cargando...</span> ·
                    <span id="userRole" style="color:var(--text-muted-light);"></span>
                </div>
            </div>

            <!-- ============================================================
            HEADER ACTIONS CON BUSCADOR UNIVERSAL
            ============================================================ -->
            <div class="header-actions">
                <div class="search-wrapper">
                    <div class="search-icon">🔍</div>
                    <input type="text" class="search-input" id="globalSearch" placeholder="Buscar en todo el sistema..."
                        autocomplete="off" />
                    <button class="search-clear" id="clearSearch" type="button">✕</button>
                    <kbd class="search-shortcut">⌘K</kbd>
                </div>
                <div class="header-actions-right">
                    <span class="info" id="totalRegistros">0 registros</span>
                    <button class="btn btn-secondary" onclick="loadDashboard()">🔄 Actualizar</button>
                </div>
            </div>

            <div class="table-container" id="inventarioContainer">
                <div class="empty-state">
                    <div class="loading-spinner"></div>
                    Cargando inventario...
                </div>
            </div>

            <div id="error" class="error"></div>
            <div class="footer">
                Sistema de Cartillas de Salud © <span id="currentYear"></span>
            </div>
        </main>
    </div>

    <script>
        // ============================================================
        // FUNCIONALIDAD DIURNO / NOCTURNO
        // ============================================================

        (function setupTheme() {
            var body = document.body;
            var themeToggle = document.getElementById('themeToggle');
            var icon = themeToggle;

            var savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                body.classList.add('light-mode');
                icon.textContent = '☀️';
            } else {
                icon.textContent = '🌙';
            }

            themeToggle.addEventListener('click', function () {
                var isLight = body.classList.toggle('light-mode');
                if (isLight) {
                    icon.textContent = '☀️';
                    localStorage.setItem('theme', 'light');
                } else {
                    icon.textContent = '🌙';
                    localStorage.setItem('theme', 'dark');
                }
            });
        })();

        // ============================================================
        // PARTÍCULAS
        // ============================================================

        function createParticles() {
            var particlesContainer = document.getElementById('particles');
            var particleCount = 15;

            for (var i = 0; i < particleCount; i++) {
                var particle = document.createElement('div');
                particle.classList.add('particle');

                var size = Math.random() * 10 + 5;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.bottom = '-' + size + 'px';
                particle.style.animationDuration = Math.random() * 20 + 10 + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.1;

                particlesContainer.appendChild(particle);
            }
        }

        // ============================================================
        // CONFIGURACIÓN DE SUPABASE
        // ============================================================
        var SUPABASE_URL = 'https://apsvmojzniglbpmmaugd.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_m9qYl2tQZMAou80wO2g66Q_VUzkf3n1';
        var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // ELEMENTOS DEL DOM
        // ============================================================
        var inventarioContainer = document.getElementById('inventarioContainer');
        var errorElement = document.getElementById('error');
        var userName = document.getElementById('userName');
        var userRole = document.getElementById('userRole');
        var totalRegistros = document.getElementById('totalRegistros');

        // ============================================================
        // 1. OBTENER USUARIO Y SUS CLUES
        // ============================================================
        async function getUserInfo() {
            try {
                var sessionResult = await supabaseClient.auth.getSession();
                var session = sessionResult.data.session;

                if (!session) {
                    window.location.href = 'login.html';
                    return null;
                }

                // CONSULTA ACTUALIZADA PARA UUID
                var userResult = await supabaseClient
                    .from('usuario')
                    .select(`
                        id_usuario,
                        nombre,
                        paterno,
                        materno,
                        id_clues,
                        clues:clues_id_uuid (id_uuid, clues, nombre)
                    `)
                    .eq('auth_user_id', session.user.id);

                if (!userResult.data || userResult.data.length === 0) {
                    console.warn('Usuario no encontrado en tabla usuario.');
                    return {
                        nombre: session.user.email,
                        id_clues: null,
                        clues: null
                    };
                }

                return userResult.data[0];

            } catch (error) {
                console.error('Error al obtener usuario:', error);
                return null;
            }
        }

        // ============================================================
        // 2. CARGAR INVENTARIO
        // ============================================================
        async function loadDashboard() {
            try {
                inventarioContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="loading-spinner"></div>
                        Cargando inventario...
                    </div>
                `;
                errorElement.textContent = '';

                var user = await getUserInfo();
                if (!user) return;

                var nombreCompleto = user.nombre || 'Usuario';
                if (user.paterno) nombreCompleto += ' ' + user.paterno;
                if (user.materno) nombreCompleto += ' ' + user.materno;
                userName.textContent = nombreCompleto;
                userRole.textContent = user.clues ? '🏥 ' + user.clues.nombre : '👤 Sin centro asignado';

                // CONSULTA ACTUALIZADA PARA UUID
                var query = supabaseClient
                    .from('inventario')
                    .select(`
                        id_inventario,
                        cantidad,
                        updated_at,
                        clues:clues_id_uuid (id_uuid, clues, nombre),
                        tipo_cartilla:tipo_cartilla_id_uuid (id_uuid, tipo_cartilla)
                    `);

                if (user.id_clues) {
                    query = query.eq('clues_id_uuid', user.id_clues);
                }

                var result = await query.order('clues_id_uuid');

                if (result.error) {
                    throw result.error;
                }

                var inventario = result.data || [];
                renderInventoryTable(inventario);

            } catch (error) {
                console.error('Error al cargar inventario:', error);
                errorElement.textContent = 'Error: ' + (error.message || 'No se pudo cargar el inventario');
                inventarioContainer.innerHTML = `
                    <div class="empty-state">
                        ❌ Error al cargar los datos
                    </div>
                `;
            }
        }

        // ============================================================
        // 3. RENDERIZAR TABLA DE INVENTARIO
        // ============================================================
        function renderInventoryTable(data) {
            totalRegistros.textContent = data.length;

            if (!data || data.length === 0) {
                inventarioContainer.innerHTML = `
                    <div class="empty-state">
                        📭 No hay registros de inventario
                    </div>
                `;
                return;
            }

            var html = `
                <table>
                    <thead>
                        <tr>
                            <th>CLUES</th>
                            <th>Centro de Salud</th>
                            <th>Tipo de Cartilla</th>
                            <th style="text-align:center;">Cantidad</th>
                            <th>Última actualización</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(function (item) {
                var clues = item.clues || {};
                var tipoCartilla = item.tipo_cartilla || {};

                var codigoClues = clues.clues || 'N/A';
                var nombreClues = clues.nombre || 'Sin nombre';
                var tipo = tipoCartilla.tipo_cartilla || 'Sin tipo';

                var cantidad = item.cantidad || 0;
                var cantidadClass = cantidad > 100 ? 'cantidad-alta' :
                    cantidad > 20 ? 'cantidad-media' : 'cantidad-baja';

                var fecha = item.updated_at ? new Date(item.updated_at).toLocaleDateString('es-MX') : 'N/A';

                html += `
                    <tr>
                        <td><span class="badge-clues">${codigoClues}</span></td>
                        <td>${nombreClues}</td>
                        <td>${tipo}</td>
                        <td style="text-align:center;">
                            <span class="cantidad ${cantidadClass}">${cantidad}</span>
                        </td>
                        <td style="color:var(--text-muted-light); font-size:0.8rem;">${fecha}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            inventarioContainer.innerHTML = html;
        }

        // ============================================================
        // 4. CERRAR SESIÓN
        // ============================================================
        async function logout() {
            try {
                await supabaseClient.auth.signOut();
                localStorage.removeItem('supabase_user');
                localStorage.removeItem('supabase_session');
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Error al cerrar sesión:', error);
            }
        }

        // ============================================================
        // 5. INICIALIZACIÓN
        // ============================================================
        document.getElementById('currentYear').textContent = new Date().getFullYear();
        window.logout = logout;

        window.addEventListener('load', function () {
            createParticles();
            loadDashboard();
        });
    </script>
    
    <script>
        // ============================================================
        // BUSCADOR UNIVERSAL
        // ============================================================
        (function setupGlobalSearch() {
            const searchInput = document.getElementById('globalSearch');
            const clearBtn = document.getElementById('clearSearch');
            const tableContainer = document.getElementById('inventarioContainer');

            // Mostrar/ocultar botón de limpiar
            searchInput.addEventListener('input', function () {
                clearBtn.classList.toggle('visible', this.value.length > 0);
                filterTable(this.value);
            });

            // Limpiar búsqueda
            clearBtn.addEventListener('click', function () {
                searchInput.value = '';
                clearBtn.classList.remove('visible');
                filterTable('');
                searchInput.focus();
            });

            // Atajo de teclado: Ctrl+K o Cmd+K
            document.addEventListener('keydown', function (e) {
                if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                    e.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                }
                // Escape para limpiar y cerrar
                if (e.key === 'Escape' && document.activeElement === searchInput) {
                    searchInput.value = '';
                    clearBtn.classList.remove('visible');
                    filterTable('');
                    searchInput.blur();
                }
            });

            // Función de filtrado
            function filterTable(query) {
                const table = tableContainer.querySelector('table');
                if (!table) return;

                const rows = table.querySelectorAll('tbody tr');
                const searchTerm = query.toLowerCase().trim();

                let visibleCount = 0;

                rows.forEach(row => {
                    const text = row.textContent.toLowerCase();
                    const match = searchTerm === '' || text.includes(searchTerm);
                    row.style.display = match ? '' : 'none';
                    if (match) visibleCount++;
                });

                // Actualizar contador
                const totalSpan = document.getElementById('totalRegistros');
                if (totalSpan) {
                    if (searchTerm === '') {
                        totalSpan.textContent = rows.length + ' registros';
                    } else {
                        totalSpan.textContent = visibleCount + ' de ' + rows.length + ' registros';
                    }
                }

                // Mostrar mensaje si no hay resultados
                const emptyState = tableContainer.querySelector('.empty-state');
                const noResults = tableContainer.querySelector('.no-results');

                if (visibleCount === 0 && rows.length > 0) {
                    if (!noResults) {
                        const msg = document.createElement('div');
                        msg.className = 'empty-state no-results';
                        msg.innerHTML = '🔍 No se encontraron resultados para "<strong>' + query + '</strong>"';
                        tableContainer.appendChild(msg);
                    } else {
                        noResults.innerHTML = '🔍 No se encontraron resultados para "<strong>' + query + '</strong>"';
                        noResults.style.display = '';
                    }
                    if (emptyState) emptyState.style.display = 'none';
                } else {
                    if (noResults) noResults.style.display = 'none';
                }
            }
        })();
    </script>
