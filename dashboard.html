<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Cartillas</title>
    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <!-- CSS Principal - TODOS los estilos base -->
    <link rel="stylesheet" href="common/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <style>
        /* ============================================================
           ESTILOS ESPECÍFICOS DEL DASHBOARD
           ============================================================ */

        /* Reset de body para el dashboard */
        body {
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
        }

        /* Contenedor principal del dashboard */
        .dashboard-container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            background: var(--container-bg);
            border-radius: var(--radius-lg);
            padding: 2rem;
            position: relative;
            z-index: 1;
            box-shadow: var(--shadow-soft);
            transition: background var(--transition-medium), box-shadow var(--transition-medium);
            animation: fadeIn 0.6s ease-out 0.4s both;
            display: flex;
            gap: 2rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           MENÚ LATERAL
           ============================================================ */
        .sidebar {
            min-width: 220px;
            max-width: 220px;
            flex-shrink: 0;
            padding-right: 1rem;
            border-right: 1px solid var(--border-color);
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 0 1.5rem 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }

        .sidebar-brand .logo-icon {
            font-size: 1.8rem;
        }

        .sidebar-brand h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            transition: color var(--transition-medium);
            line-height: 1.2;
        }

        .sidebar-brand h2 small {
            display: block;
            font-size: 0.65rem;
            font-weight: 400;
            color: var(--text-muted-light);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 1rem;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            text-decoration: none;
            transition: all var(--transition-medium);
            margin-bottom: 0.25rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
        }

        .menu-item:hover {
            background: var(--menu-item-hover, rgba(255, 255, 255, 0.04));
            color: var(--text-primary);
        }

        .menu-item.active {
            background: var(--menu-item-active, rgba(67, 97, 238, 0.2));
            color: var(--text-primary);
            box-shadow: inset 3px 0 0 var(--btn-primary);
        }

        .menu-item .icon {
            font-size: 1.3rem;
            width: 28px;
            text-align: center;
            flex-shrink: 0;
        }

        .menu-item .badge-menu {
            margin-left: auto;
            background: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.6rem;
            padding: 0.1rem 0.5rem;
            border-radius: 30px;
            font-weight: 600;
        }

        .menu-divider {
            height: 1px;
            background: var(--border-color);
            margin: 0.75rem 0;
            opacity: 0.5;
        }

        .menu-item.danger {
            color: var(--btn-danger, #f72585);
        }

        .menu-item.danger:hover {
            background: rgba(247, 37, 133, 0.1);
        }

        /* ============================================================
           CONTENIDO PRINCIPAL
           ============================================================ */
        .main-content {
            flex: 1;
            min-width: 0;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 0.5rem;
            padding-right: 3.5rem;
        }

        .dashboard-header h1 {
            font-weight: 600;
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
            transition: color var(--transition-medium);
        }

        .dashboard-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: color var(--transition-medium);
        }

        /* ============================================================
           USER BADGE
           ============================================================ */
        .user-badge {
            display: inline-block;
            background: var(--container-bg);
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-soft);
            color: var(--text-primary);
            transition: all var(--transition-medium);
        }

        .user-badge strong {
            color: var(--badge-text);
        }

        /* ============================================================
           TABLA
           ============================================================ */
        .table-container {
            border-radius: var(--radius-md);
            overflow: auto;
            margin-top: 1rem;
            background: var(--container-bg);
            box-shadow: var(--shadow-pressed);
            transition: all var(--transition-medium);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 600px;
        }

        thead {
            background: rgba(255, 255, 255, 0.02);
        }

        th {
            text-align: left;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
            transition: color var(--transition-medium);
        }

        tr:hover td {
            background: var(--table-hover, rgba(255, 255, 255, 0.03));
        }

        .cantidad {
            font-weight: 600;
        }

        .cantidad-alta {
            color: var(--cantidad-alta, #4cc9f0);
        }

        .cantidad-media {
            color: var(--cantidad-media, #f8961e);
        }

        .cantidad-baja {
            color: var(--cantidad-baja, #f72585);
        }

        .badge-clues {
            display: inline-block;
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 0.15rem 0.6rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 500;
            transition: all var(--transition-medium);
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .header-actions .info {
            color: var(--text-muted-light);
            font-size: 0.8rem;
            transition: color var(--transition-medium);
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            border-top-color: var(--text-primary);
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted-light);
            font-size: 0.9rem;
        }

        .error {
            color: var(--error-color, #f72585);
            text-align: center;
            margin-top: 1rem;
            font-weight: 500;
            transition: color var(--transition-medium);
        }

        /* ============================================================
           RESPONSIVE DEL DASHBOARD
           ============================================================ */
        @media (max-width: 992px) {
            .dashboard-container {
                flex-direction: column;
                padding: 1.5rem;
            }

            .sidebar {
                min-width: 100%;
                max-width: 100%;
                padding-right: 0;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding-bottom: 1rem;
                margin-bottom: 1rem;
            }

            .sidebar-brand {
                padding: 0 0 0.75rem 0;
                margin-bottom: 0.75rem;
            }

            .menu-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 0.25rem;
            }

            .menu-item {
                padding: 0.5rem 0.75rem;
                font-size: 0.8rem;
            }

            .menu-item .icon {
                font-size: 1.1rem;
                width: 24px;
            }

            .menu-divider {
                display: none;
            }

            .dashboard-header {
                padding-right: 0;
            }

            .dashboard-header h1 {
                font-size: 1.4rem;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            .dashboard-container {
                padding: 1rem;
            }

            .menu-grid {
                grid-template-columns: 1fr 1fr;
            }

            .menu-item {
                font-size: 0.75rem;
                padding: 0.4rem 0.6rem;
            }

            .menu-item .icon {
                font-size: 1rem;
                width: 20px;
            }

            table {
                font-size: 0.75rem;
                min-width: 400px;
            }

            th,
            td {
                padding: 0.5rem;
            }

            .header-actions {
                flex-direction: column;
                align-items: stretch;
            }
        }

        @media (max-width: 400px) {
            .menu-grid {
                grid-template-columns: 1fr;
            }

            table {
                min-width: 320px;
                font-size: 0.7rem;
            }

            th,
            td {
                padding: 0.35rem 0.5rem;
            }
        }
    </style>
</head>

<body>

    <!-- Partículas -->
    <div class="particles" id="particles"></div>

    <div class="dashboard-container" id="app">
        <!-- Botón de tema -->
        <button class="theme-toggle" id="themeToggle" type="button" title="Cambiar tema">
            🌙
        </button>

        <!-- ============================================================
        MENÚ LATERAL
        ============================================================ -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="logo-icon">📋</span>
                <h2>Cartillas <small>Control de Salud</small></h2>
            </div>

            <nav class="menu-grid">
                <a href="dashboard.html" class="menu-item active">
                    <span class="icon">📊</span> Dashboard
                </a>
                <a href="traspasos.html" class="menu-item">
                    <span class="icon">🔄</span> Traspasos
                </a>
                <a href="censo.html" class="menu-item">
                    <span class="icon">📝</span> Censo
                </a>
                <a href="reportes.html" class="menu-item">
                    <span class="icon">📄</span> Reportes
                </a>
                <a href="usuarios.html" class="menu-item">
                    <span class="icon">👥</span> Usuarios
                </a>
                <a href="registro_usuarios.html" class="menu-item">
                    <span class="icon">➕</span> Registrar
                </a>
                <a href="tickets.html" class="menu-item">
                    <span class="icon">🎫</span> Tickets
                </a>
                <a href="contactos.html" class="menu-item">
                    <span class="icon">📬</span> Contactos
                </a>
            </nav>

            <div class="menu-divider"></div>

            <button class="menu-item" onclick="logout()" style="color:var(--btn-danger);">
                <span class="icon">🚪</span> Cerrar Sesión
            </button>
        </aside>

        <!-- ============================================================
        CONTENIDO PRINCIPAL
        ============================================================ -->
        <main class="main-content">
            <!-- HEADER -->
            <div class="dashboard-header">
                <div>
                    <h1>📋 Panel de Control</h1>
                    <p class="subtitle">Sistema de Control de Cartillas</p>
                </div>
            </div>

            <!-- INFO USUARIO -->
            <div id="userInfo">
                <div class="user-badge">
                    <span id="userName">Cargando...</span> ·
                    <span id="userRole" style="color:var(--text-muted-light);"></span>
                </div>
            </div>

            <!-- TABLA INVENTARIO -->
            <div class="header-actions">
                <span class="info">
                    <span id="totalRegistros">0</span> registros encontrados
                </span>
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="loadDashboard()">🔄 Actualizar</button>
                </div>
            </div>

            <div class="table-container" id="inventarioContainer">
                <div class="empty-state">
                    <div class="loading-spinner"></div>
                    Cargando inventario...
                </div>
            </div>

            <div id="error" class="error"></div>
            <div class="footer">
                Sistema de Cartillas de Salud © <span id="currentYear"></span>
            </div>
        </main>
    </div>

    <script>
        // ============================================================
        // FUNCIONALIDAD DIURNO / NOCTURNO
        // ============================================================

        (function setupTheme() {
            var body = document.body;
            var themeToggle = document.getElementById('themeToggle');
            var icon = themeToggle;

            var savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                body.classList.add('light-mode');
                icon.textContent = '☀️';
            } else {
                icon.textContent = '🌙';
            }

            themeToggle.addEventListener('click', function () {
                var isLight = body.classList.toggle('light-mode');
                if (isLight) {
                    icon.textContent = '☀️';
                    localStorage.setItem('theme', 'light');
                } else {
                    icon.textContent = '🌙';
                    localStorage.setItem('theme', 'dark');
                }
            });
        })();

        // ============================================================
        // PARTÍCULAS
        // ============================================================

        function createParticles() {
            var particlesContainer = document.getElementById('particles');
            var particleCount = 15;

            for (var i = 0; i < particleCount; i++) {
                var particle = document.createElement('div');
                particle.classList.add('particle');

                var size = Math.random() * 10 + 5;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.bottom = '-' + size + 'px';
                particle.style.animationDuration = Math.random() * 20 + 10 + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.1;

                particlesContainer.appendChild(particle);
            }
        }

        // ============================================================
        // CONFIGURACIÓN DE SUPABASE
        // ============================================================
        var SUPABASE_URL = 'https://apsvmojzniglbpmmaugd.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_m9qYl2tQZMAou80wO2g66Q_VUzkf3n1';
        var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // ELEMENTOS DEL DOM
        // ============================================================
        var inventarioContainer = document.getElementById('inventarioContainer');
        var errorElement = document.getElementById('error');
        var userName = document.getElementById('userName');
        var userRole = document.getElementById('userRole');
        var totalRegistros = document.getElementById('totalRegistros');

        // ============================================================
        // 1. OBTENER USUARIO Y SUS CLUES
        // ============================================================
        async function getUserInfo() {
            try {
                var sessionResult = await supabaseClient.auth.getSession();
                var session = sessionResult.data.session;

                if (!session) {
                    window.location.href = 'login.html';
                    return null;
                }

                // CONSULTA ACTUALIZADA PARA UUID
                var userResult = await supabaseClient
                    .from('usuario')
                    .select(`
                        id_usuario,
                        nombre,
                        paterno,
                        materno,
                        id_clues,
                        clues:clues_id_uuid (id_uuid, clues, nombre)
                    `)
                    .eq('auth_user_id', session.user.id);

                if (!userResult.data || userResult.data.length === 0) {
                    console.warn('Usuario no encontrado en tabla usuario.');
                    return {
                        nombre: session.user.email,
                        id_clues: null,
                        clues: null
                    };
                }

                return userResult.data[0];

            } catch (error) {
                console.error('Error al obtener usuario:', error);
                return null;
            }
        }

        // ============================================================
        // 2. CARGAR INVENTARIO
        // ============================================================
        async function loadDashboard() {
            try {
                inventarioContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="loading-spinner"></div>
                        Cargando inventario...
                    </div>
                `;
                errorElement.textContent = '';

                var user = await getUserInfo();
                if (!user) return;

                var nombreCompleto = user.nombre || 'Usuario';
                if (user.paterno) nombreCompleto += ' ' + user.paterno;
                if (user.materno) nombreCompleto += ' ' + user.materno;
                userName.textContent = nombreCompleto;
                userRole.textContent = user.clues ? '🏥 ' + user.clues.nombre : '👤 Sin centro asignado';

                // CONSULTA ACTUALIZADA PARA UUID
                var query = supabaseClient
                    .from('inventario')
                    .select(`
                        id_inventario,
                        cantidad,
                        updated_at,
                        clues:clues_id_uuid (id_uuid, clues, nombre),
                        tipo_cartilla:tipo_cartilla_id_uuid (id_uuid, tipo_cartilla)
                    `);

                if (user.id_clues) {
                    query = query.eq('clues_id_uuid', user.id_clues);
                }

                var result = await query.order('clues_id_uuid');

                if (result.error) {
                    throw result.error;
                }

                var inventario = result.data || [];
                renderInventoryTable(inventario);

            } catch (error) {
                console.error('Error al cargar inventario:', error);
                errorElement.textContent = 'Error: ' + (error.message || 'No se pudo cargar el inventario');
                inventarioContainer.innerHTML = `
                    <div class="empty-state">
                        ❌ Error al cargar los datos
                    </div>
                `;
            }
        }

        // ============================================================
        // 3. RENDERIZAR TABLA DE INVENTARIO
        // ============================================================
        function renderInventoryTable(data) {
            totalRegistros.textContent = data.length;

            if (!data || data.length === 0) {
                inventarioContainer.innerHTML = `
                    <div class="empty-state">
                        📭 No hay registros de inventario
                    </div>
                `;
                return;
            }

            var html = `
                <table>
                    <thead>
                        <tr>
                            <th>CLUES</th>
                            <th>Centro de Salud</th>
                            <th>Tipo de Cartilla</th>
                            <th style="text-align:center;">Cantidad</th>
                            <th>Última actualización</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(function (item) {
                var clues = item.clues || {};
                var tipoCartilla = item.tipo_cartilla || {};

                var codigoClues = clues.clues || 'N/A';
                var nombreClues = clues.nombre || 'Sin nombre';
                var tipo = tipoCartilla.tipo_cartilla || 'Sin tipo';

                var cantidad = item.cantidad || 0;
                var cantidadClass = cantidad > 100 ? 'cantidad-alta' :
                    cantidad > 20 ? 'cantidad-media' : 'cantidad-baja';

                var fecha = item.updated_at ? new Date(item.updated_at).toLocaleDateString('es-MX') : 'N/A';

                html += `
                    <tr>
                        <td><span class="badge-clues">${codigoClues}</span></td>
                        <td>${nombreClues}</td>
                        <td>${tipo}</td>
                        <td style="text-align:center;">
                            <span class="cantidad ${cantidadClass}">${cantidad}</span>
                        </td>
                        <td style="color:var(--text-muted-light); font-size:0.8rem;">${fecha}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            inventarioContainer.innerHTML = html;
        }

        // ============================================================
        // 4. CERRAR SESIÓN
        // ============================================================
        async function logout() {
            try {
                await supabaseClient.auth.signOut();
                localStorage.removeItem('supabase_user');
                localStorage.removeItem('supabase_session');
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Error al cerrar sesión:', error);
            }
        }

        // ============================================================
        // 5. INICIALIZACIÓN
        // ============================================================
        document.getElementById('currentYear').textContent = new Date().getFullYear();
        window.logout = logout;

        window.addEventListener('load', function () {
            createParticles();
            loadDashboard();
        });
    </script>

</body>

</html>
