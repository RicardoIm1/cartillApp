<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Cartillas</title>
    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <!-- CSS Principal - TODOS los estilos base -->
    <link rel="stylesheet" href="common/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <style>
        /* ============================================================
           ESTILOS ESPECÍFICOS DEL DASHBOARD
           ============================================================ */

        /* Reset de body para dashboard */
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem;
            overflow-x: hidden;
        }

        /* Contenedor principal del dashboard */
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            background: var(--container-bg);
            border-radius: 20px;
            padding: 2rem;
            position: relative;
            z-index: 1;
            box-shadow: 9px 9px 18px var(--container-shadow-1),
                -9px -9px 18px var(--container-shadow-2);
            transition: background 0.4s ease, box-shadow 0.4s ease;
            animation: fadeIn 0.6s ease-out 0.4s both;
        }

        /* Header actions */
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-right: 3.5rem;
        }

        /* Títulos */
        .dashboard-title {
            font-weight: 600;
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .dashboard-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        /* User badge */
        .user-badge {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            background: var(--user-badge-bg, var(--card-bg));
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--user-badge-border, var(--border-color));
            box-shadow: 4px 4px 8px var(--container-shadow-1),
                -4px -4px 8px var(--container-shadow-2);
            color: var(--text-primary);
            font-size: 0.85rem;
            transition: background 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
        }

        .user-badge strong {
            color: var(--badge-text, #4cc9f0);
        }

        .user-badge .badge-rol {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 500;
            text-transform: uppercase;
            background: var(--badge-bg);
            color: var(--badge-text);
        }

        /* Botones específicos del dashboard */
        .btn-sm {
            padding: 0.3rem 0.8rem;
            font-size: 0.75rem;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* Formularios */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
            transition: background 0.3s ease, border 0.3s ease;
        }

        .form-section-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        /* Checkbox group */
        .checkbox-group {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            padding-top: 0.5rem;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 400;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            box-shadow: none;
            accent-color: var(--btn-primary);
        }

        /* Tabla */
        .table-container {
            border-radius: 16px;
            overflow: auto;
            margin-top: 1rem;
            background: var(--container-bg);
            box-shadow: inset 4px 4px 8px var(--container-shadow-1),
                inset -4px -4px 8px var(--container-shadow-2);
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 800px;
        }

        thead {
            background: var(--table-header-bg, var(--card-bg));
        }

        th {
            text-align: left;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            transition: color 0.3s ease;
            vertical-align: middle;
        }

        tr:hover td {
            background: var(--table-row-hover, rgba(255, 255, 255, 0.02));
        }

        /* Search bar */
        .search-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-bar input {
            max-width: 300px;
        }

        .search-bar .info {
            color: var(--text-muted-light);
            font-size: 0.8rem;
        }

        /* Estados */
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted-light);
            font-size: 0.9rem;
        }

        .error {
            color: var(--error-color, #f72585);
            text-align: center;
            margin-top: 1rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .success-msg {
            color: var(--success-color, #4cc9f0);
            text-align: center;
            margin-top: 1rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--container-bg);
            border-radius: 20px;
            padding: 2rem;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 9px 9px 18px var(--container-shadow-1),
                -9px -9px 18px var(--container-shadow-2);
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content h2 {
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            justify-content: flex-end;
        }

        /* Loading spinner */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            border-top-color: var(--text-primary);
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive dashboard */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .container {
                padding: 1rem;
            }

            .header-actions {
                padding-right: 0;
                flex-direction: column;
                align-items: stretch;
            }

            .dashboard-title {
                font-size: 1.4rem;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 1rem;
                margin: 1rem;
            }

            .search-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-bar input {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0.75rem;
            }

            .form-section {
                padding: 0.75rem;
            }

            .checkbox-group {
                gap: 0.75rem;
            }

            .user-badge {
                font-size: 0.75rem;
                padding: 0.4rem 0.8rem;
            }
        }
    </style>
</head>

<body>

    <!-- Partículas -->
    <div class="particles" id="particles"></div>

    <div class="dashboard-container" id="app">
        <!-- Botón de tema -->
        <button class="theme-toggle" id="themeToggle" type="button" title="Cambiar tema">
            🌙
        </button>

        <!-- ============================================================
        MENÚ LATERAL
        ============================================================ -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="logo-icon">📋</span>
                <h2>Cartillas <small>Control de Salud</small></h2>
            </div>

            <nav class="menu-grid">
                <a href="dashboard.html" class="menu-item active">
                    <span class="icon">📊</span> Dashboard
                </a>
                <a href="traspasos.html" class="menu-item">
                    <span class="icon">🔄</span> Traspasos
                </a>
                <a href="censo.html" class="menu-item">
                    <span class="icon">📝</span> Censo
                </a>
                <a href="reportes.html" class="menu-item">
                    <span class="icon">📄</span> Reportes
                </a>
                <a href="usuarios.html" class="menu-item">
                    <span class="icon">👥</span> Usuarios
                </a>
                <a href="registro_usuarios.html" class="menu-item">
                    <span class="icon">➕</span> Registrar
                </a>
                <a href="tickets.html" class="menu-item">
                    <span class="icon">🎫</span> Tickets
                </a>
                <a href="contactos.html" class="menu-item">
                    <span class="icon">📬</span> Contactos
                </a>
            </nav>

            <div class="menu-divider"></div>

            <button class="menu-item" onclick="logout()" style="color:var(--btn-danger);">
                <span class="icon">🚪</span> Cerrar Sesión
            </button>
        </aside>

        <!-- ============================================================
        CONTENIDO PRINCIPAL
        ============================================================ -->
        <main class="main-content">
            <!-- HEADER -->
            <div class="dashboard-header">
                <div>
                    <h1>📋 Panel de Control</h1>
                    <p class="subtitle">Sistema de Control de Cartillas</p>
                </div>
            </div>

            <!-- INFO USUARIO -->
            <div id="userInfo">
                <div class="user-badge">
                    <span id="userName">Cargando...</span> ·
                    <span id="userRole" style="color:var(--text-muted-light);"></span>
                </div>
            </div>

            <!-- TABLA INVENTARIO -->
            <div class="header-actions">
                <span class="info">
                    <span id="totalRegistros">0</span> registros encontrados
                </span>
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="loadDashboard()">🔄 Actualizar</button>
                </div>
            </div>

            <div class="table-container" id="inventarioContainer">
                <div class="empty-state">
                    <div class="loading-spinner"></div>
                    Cargando inventario...
                </div>
            </div>

            <div id="error" class="error"></div>
            <div class="footer">
                Sistema de Cartillas de Salud © <span id="currentYear"></span>
            </div>
        </main>
    </div>

    <script>
        // ============================================================
        // FUNCIONALIDAD DIURNO / NOCTURNO
        // ============================================================

        (function setupTheme() {
            var body = document.body;
            var themeToggle = document.getElementById('themeToggle');
            var icon = themeToggle;

            var savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                body.classList.add('light-mode');
                icon.textContent = '☀️';
            } else {
                icon.textContent = '🌙';
            }

            themeToggle.addEventListener('click', function () {
                var isLight = body.classList.toggle('light-mode');
                if (isLight) {
                    icon.textContent = '☀️';
                    localStorage.setItem('theme', 'light');
                } else {
                    icon.textContent = '🌙';
                    localStorage.setItem('theme', 'dark');
                }
            });
        })();

        // ============================================================
        // PARTÍCULAS
        // ============================================================

        function createParticles() {
            var particlesContainer = document.getElementById('particles');
            var particleCount = 15;

            for (var i = 0; i < particleCount; i++) {
                var particle = document.createElement('div');
                particle.classList.add('particle');

                var size = Math.random() * 10 + 5;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.bottom = '-' + size + 'px';
                particle.style.animationDuration = Math.random() * 20 + 10 + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.1;

                particlesContainer.appendChild(particle);
            }
        }

        // ============================================================
        // CONFIGURACIÓN DE SUPABASE
        // ============================================================
        var SUPABASE_URL = 'https://apsvmojzniglbpmmaugd.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_m9qYl2tQZMAou80wO2g66Q_VUzkf3n1';
        var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // ELEMENTOS DEL DOM
        // ============================================================
        var inventarioContainer = document.getElementById('inventarioContainer');
        var errorElement = document.getElementById('error');
        var userName = document.getElementById('userName');
        var userRole = document.getElementById('userRole');
        var totalRegistros = document.getElementById('totalRegistros');

        // ============================================================
        // 1. OBTENER USUARIO Y SUS CLUES
        // ============================================================
        async function getUserInfo() {
            try {
                var sessionResult = await supabaseClient.auth.getSession();
                var session = sessionResult.data.session;

                if (!session) {
                    window.location.href = 'login.html';
                    return null;
                }

                // CONSULTA ACTUALIZADA PARA UUID
                var userResult = await supabaseClient
                    .from('usuario')
                    .select(`
                        id_usuario,
                        nombre,
                        paterno,
                        materno,
                        id_clues,
                        clues:clues_id_uuid (id_uuid, clues, nombre)
                    `)
                    .eq('auth_user_id', session.user.id);

                if (!userResult.data || userResult.data.length === 0) {
                    console.warn('Usuario no encontrado en tabla usuario.');
                    return {
                        nombre: session.user.email,
                        id_clues: null,
                        clues: null
                    };
                }

                return userResult.data[0];

            } catch (error) {
                console.error('Error al obtener usuario:', error);
                return null;
            }
        }

        // ============================================================
        // 2. CARGAR INVENTARIO
        // ============================================================
        async function loadDashboard() {
            try {
                inventarioContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="loading-spinner"></div>
                        Cargando inventario...
                    </div>
                `;
                errorElement.textContent = '';

                var user = await getUserInfo();
                if (!user) return;

                var nombreCompleto = user.nombre || 'Usuario';
                if (user.paterno) nombreCompleto += ' ' + user.paterno;
                if (user.materno) nombreCompleto += ' ' + user.materno;
                userName.textContent = nombreCompleto;
                userRole.textContent = user.clues ? '🏥 ' + user.clues.nombre : '👤 Sin centro asignado';

                // CONSULTA ACTUALIZADA PARA UUID
                var query = supabaseClient
                    .from('inventario')
                    .select(`
                        id_inventario,
                        cantidad,
                        updated_at,
                        clues:clues_id_uuid (id_uuid, clues, nombre),
                        tipo_cartilla:tipo_cartilla_id_uuid (id_uuid, tipo_cartilla)
                    `);

                if (user.id_clues) {
                    query = query.eq('clues_id_uuid', user.id_clues);
                }

                var result = await query.order('clues_id_uuid');

                if (result.error) {
                    throw result.error;
                }

                var inventario = result.data || [];
                renderInventoryTable(inventario);

            } catch (error) {
                console.error('Error al cargar inventario:', error);
                errorElement.textContent = 'Error: ' + (error.message || 'No se pudo cargar el inventario');
                inventarioContainer.innerHTML = `
                    <div class="empty-state">
                        ❌ Error al cargar los datos
                    </div>
                `;
            }
        }

        // ============================================================
        // 3. RENDERIZAR TABLA DE INVENTARIO
        // ============================================================
        function renderInventoryTable(data) {
            totalRegistros.textContent = data.length;

            if (!data || data.length === 0) {
                inventarioContainer.innerHTML = `
                    <div class="empty-state">
                        📭 No hay registros de inventario
                    </div>
                `;
                return;
            }

            var html = `
                <table>
                    <thead>
                        <tr>
                            <th>CLUES</th>
                            <th>Centro de Salud</th>
                            <th>Tipo de Cartilla</th>
                            <th style="text-align:center;">Cantidad</th>
                            <th>Última actualización</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(function (item) {
                var clues = item.clues || {};
                var tipoCartilla = item.tipo_cartilla || {};

                var codigoClues = clues.clues || 'N/A';
                var nombreClues = clues.nombre || 'Sin nombre';
                var tipo = tipoCartilla.tipo_cartilla || 'Sin tipo';

                var cantidad = item.cantidad || 0;
                var cantidadClass = cantidad > 100 ? 'cantidad-alta' :
                    cantidad > 20 ? 'cantidad-media' : 'cantidad-baja';

                var fecha = item.updated_at ? new Date(item.updated_at).toLocaleDateString('es-MX') : 'N/A';

                html += `
                    <tr>
                        <td><span class="badge-clues">${codigoClues}</span></td>
                        <td>${nombreClues}</td>
                        <td>${tipo}</td>
                        <td style="text-align:center;">
                            <span class="cantidad ${cantidadClass}">${cantidad}</span>
                        </td>
                        <td style="color:var(--text-muted-light); font-size:0.8rem;">${fecha}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            inventarioContainer.innerHTML = html;
        }

        // ============================================================
        // 4. CERRAR SESIÓN
        // ============================================================
        async function logout() {
            try {
                await supabaseClient.auth.signOut();
                localStorage.removeItem('supabase_user');
                localStorage.removeItem('supabase_session');
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Error al cerrar sesión:', error);
            }
        }

        // ============================================================
        // 5. INICIALIZACIÓN
        // ============================================================
        document.getElementById('currentYear').textContent = new Date().getFullYear();
        window.logout = logout;

        window.addEventListener('load', function () {
            createParticles();
            loadDashboard();
        });
    </script>

</body>

</html>
