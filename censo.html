<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Censo - Sistema de Cartillas</title>

    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <!-- CSS Principal - styles.css -->
    <link rel="stylesheet" href="common/styles.css" />

    <!-- ============================================================
    JAVASCRIPT EXTERNO
    ============================================================ -->
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <!-- Transiciones cinematográficas para modales -->
    <script src="common/transiciones.js">
    </script>

    <style>
        /* ============================================================
       CSS VARIABLES PARA TEMA DIURNO / NOCTURNO - ESTILO JUGUETE 80'S
       ============================================================ */
        :root {
            /* Modo nocturno (por defecto) */
            --bg-gradient-start: #141E30;
            --bg-gradient-end: #243B55;
            --container-bg: #1c2541;
            --container-shadow-1: #0d1320;
            --container-shadow-2: #2b3f60;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.9);
            --text-muted: rgba(255, 255, 255, 0.6);
            --text-muted-light: rgba(255, 255, 255, 0.4);
            --input-bg: #1c2541;
            --input-shadow-1: #0d1320;
            --input-shadow-2: #2b3f60;
            --input-focus-bg: #243b55;
            --input-placeholder: rgba(255, 255, 255, 0.5);
            --btn-primary: #4361ee;
            --btn-primary-hover: #3a56d4;
            --btn-primary-shadow-1: #2b3f60;
            --btn-primary-shadow-2: #3a56d4;
            --btn-danger: #f72585;
            --btn-danger-hover: #d91a6e;
            --btn-success: #4cc9f0;
            --btn-success-hover: #3ab8dd;
            --btn-secondary-bg: #1c2541;
            --error-color: #f72585;
            --footer-color: rgba(255, 255, 255, 0.5);
            --particle-color: rgba(255, 255, 255, 0.4);
            --border-color: rgba(255, 255, 255, 0.06);
            --label-color: rgba(255, 255, 255, 0.7);
            --select-option-bg: #1a1a2e;
            --table-header-bg: rgba(255, 255, 255, 0.03);
            --table-row-hover: rgba(255, 255, 255, 0.02);
            --badge-bg: rgba(76, 201, 240, 0.15);
            --badge-text: #4cc9f0;
            --card-bg: rgba(255, 255, 255, 0.02);
        }

        /* Modo diurno */
        body.light-mode {
            --bg-gradient-start: #e0e5ec;
            --bg-gradient-end: #f0f2f8;
            --container-bg: #e8ecf4;
            --container-shadow-1: #b8bcc8;
            --container-shadow-2: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #2d2d44;
            --text-muted: rgba(0, 0, 0, 0.7);
            --text-muted-light: rgba(0, 0, 0, 0.4);
            --input-bg: #e8ecf4;
            --input-shadow-1: #b8bcc8;
            --input-shadow-2: #ffffff;
            --input-focus-bg: #d5dbe8;
            --input-placeholder: rgba(0, 0, 0, 0.4);
            --btn-primary: #4361ee;
            --btn-primary-hover: #3a56d4;
            --btn-primary-shadow-1: #2a3f8a;
            --btn-primary-shadow-2: #6b8aff;
            --btn-danger: #e63946;
            --btn-danger-hover: #c62828;
            --btn-success: #0ea5e9;
            --btn-success-hover: #0284c7;
            --btn-secondary-bg: #e8ecf4;
            --error-color: #e63946;
            --footer-color: rgba(0, 0, 0, 0.5);
            --particle-color: rgba(0, 0, 0, 0.10);
            --border-color: rgba(0, 0, 0, 0.06);
            --label-color: rgba(0, 0, 0, 0.7);
            --select-option-bg: #ffffff;
            --table-header-bg: rgba(0, 0, 0, 0.02);
            --table-row-hover: rgba(0, 0, 0, 0.02);
            --badge-bg: rgba(14, 165, 233, 0.10);
            --badge-text: #0ea5e9;
            --card-bg: rgba(255, 255, 255, 0.5);
        }

        /* ============================================================
       ESTILOS GENERALES
       ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(145deg, var(--bg-gradient-start), var(--bg-gradient-end));
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: background 0.5s ease, color 0.3s ease;
            color: var(--text-primary);
            overflow-x: hidden;
            height: 100vh;
            overflow-y: hidden;
        }

        /* ============================================================
       PARTÍCULAS
       ============================================================ */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: var(--particle-color);
            border-radius: 50%;
            animation: float linear infinite;
            transition: background 0.5s ease;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
            }
        }

        /* ============================================================
       CLAYMORPHISM CONTAINER - PLACA PRINCIPAL
       ============================================================ */
        .censo-container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            background: var(--container-bg);
            border-radius: 20px;
            padding: 2rem;
            position: relative;
            z-index: 1;
            box-shadow: 9px 9px 18px var(--container-shadow-1),
                -9px -9px 18px var(--container-shadow-2);
            transition: background 0.4s ease, box-shadow 0.4s ease;
            animation: fadeIn 0.6s ease-out 0.4s both;
            height: calc(100vh - 4rem);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        body.light-mode .censo-container {
            box-shadow: 9px 9px 18px var(--container-shadow-1),
                -9px -9px 18px var(--container-shadow-2);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
       BOTÓN DE TEMA - CON RELIEVE
       ============================================================ */
        .theme-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--container-bg);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 4px 4px 8px var(--container-shadow-1),
                -4px -4px 8px var(--container-shadow-2);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .theme-toggle:active {
            transform: scale(0.94);
            box-shadow: inset 3px 3px 6px var(--container-shadow-1),
                inset -3px -3px 6px var(--container-shadow-2);
        }

        /* ============================================================
       HEADER
       ============================================================ */
        .censo-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
            padding-right: 3.5rem;
            flex-shrink: 0;
        }

        .censo-header h1 {
            font-weight: 600;
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .censo-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        /* ============================================================
       BOTONES - CON RELIEVE PROFUNDO
       ============================================================ */
        .btn {
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
            box-shadow: 4px 4px 8px var(--container-shadow-1),
                -4px -4px 8px var(--container-shadow-2);
            background: var(--container-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: scale(0.94);
            box-shadow: inset 3px 3px 6px var(--container-shadow-1),
                inset -3px -3px 6px var(--container-shadow-2);
        }

        .btn-primary {
            background: var(--btn-primary);
            color: white;
            box-shadow: 4px 4px 8px var(--btn-primary-shadow-1),
                -4px -4px 8px var(--btn-primary-shadow-2);
            border: none;
        }

        .btn-primary:hover {
            background: var(--btn-primary-hover);
            transform: translateY(-2px);
        }

        .btn-primary:active {
            box-shadow: inset 3px 3px 6px var(--btn-primary-shadow-1),
                inset -3px -3px 6px var(--btn-primary-shadow-2);
        }

        .btn-success {
            background: var(--btn-success);
            color: white;
            box-shadow: 4px 4px 8px rgba(76, 201, 240, 0.25),
                -4px -4px 8px rgba(255, 255, 255, 0.02);
            border: none;
        }

        .btn-success:hover {
            background: var(--btn-success-hover);
            transform: translateY(-2px);
        }

        .btn-success:active {
            box-shadow: inset 3px 3px 6px rgba(76, 201, 240, 0.25),
                inset -3px -3px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-secondary {
            background: var(--btn-secondary-bg);
            color: var(--text-primary);
            box-shadow: 4px 4px 8px var(--container-shadow-1),
                -4px -4px 8px var(--container-shadow-2);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
        }

        .btn-secondary:active {
            box-shadow: inset 3px 3px 6px var(--container-shadow-1),
                inset -3px -3px 6px var(--container-shadow-2);
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* ============================================================
       USER BADGE - CON RELIEVE
       ============================================================ */
        .user-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            background: var(--card-bg);
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
            box-shadow: 4px 4px 8px var(--container-shadow-1),
                -4px -4px 8px var(--container-shadow-2);
            color: var(--text-primary);
            font-size: 0.85rem;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .user-badge strong {
            color: var(--badge-text);
        }

        .user-badge .badge-rol {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 500;
            text-transform: uppercase;
            background: var(--badge-bg);
            color: var(--badge-text);
        }

        /* ============================================================
       SEARCH BAR - CON RELIEVE
       ============================================================ */
        .search-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            align-items: center;
            flex-shrink: 0;
            background: var(--card-bg);
            padding: 0.6rem 1rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 4px 4px 8px var(--container-shadow-1),
                -4px -4px 8px var(--container-shadow-2);
        }

        .search-bar .search-input-wrap {
            flex: 1;
            min-width: 200px;
            max-width: 400px;
            position: relative;
        }

        .search-bar .search-input-wrap input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.8rem;
            border: none;
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: inset 4px 4px 8px var(--input-shadow-1),
                inset -4px -4px 8px var(--input-shadow-2);
        }

        .search-bar .search-input-wrap input:focus {
            outline: none;
            background: var(--input-focus-bg);
            box-shadow: inset 2px 2px 5px var(--input-shadow-1),
                inset -2px -2px 5px var(--input-shadow-2),
                0 0 0 3px rgba(67, 97, 238, 0.15);
        }

        .search-bar .search-input-wrap .search-icon {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.4;
            font-size: 1rem;
            pointer-events: none;
        }

        .search-bar .info {
            color: var(--text-muted-light);
            font-size: 0.8rem;
            padding: 0.4rem 0.8rem;
            background: var(--card-bg);
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 4px 4px 8px var(--container-shadow-1),
                -4px -4px 8px var(--container-shadow-2);
        }

        /* ============================================================
       TABLA - CON RELIEVE INTERNO
       ============================================================ */
        .table-container {
            border-radius: 16px;
            overflow: auto;
            margin-top: 0.5rem;
            background: var(--container-bg);
            box-shadow: inset 4px 4px 8px var(--container-shadow-1),
                inset -4px -4px 8px var(--container-shadow-2);
            transition: background 0.3s ease, box-shadow 0.3s ease;
            flex: 1;
            min-height: 0;
            padding: 0.5rem;
        }

        .table-container::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .table-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
        }

        .table-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 800px;
        }

        thead {
            background: var(--table-header-bg);
        }

        thead th {
            text-align: left;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 2;
            background: var(--container-bg);
        }

        tbody td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            transition: all 0.3s ease;
            vertical-align: middle;
        }

        tbody tr {
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            opacity: 1;
        }

        tbody tr:hover td {
            background: var(--table-row-hover);
        }

        tbody tr[style*="display: none"] {
            opacity: 0;
            transform: scale(0.98);
        }

        /* ============================================================
       BADGES - CON RELIEVE
       ============================================================ */
        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            background: var(--badge-bg);
            color: var(--badge-text);
            transition: all 0.3s ease;
            box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.05);
        }

        .badge-clues {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(145deg, var(--btn-success), var(--btn-primary));
            box-shadow: 4px 4px 8px var(--container-shadow-1),
                -4px -4px 8px var(--container-shadow-2);
        }

        /* ============================================================
       ACCIONES DE TABLA - BOTONES CON RELIEVE
       ============================================================ */
        .table-actions {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            padding: 0;
            border: none;
            border-radius: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            color: var(--text-secondary);
            box-shadow: 4px 4px 8px var(--container-shadow-1),
                -4px -4px 8px var(--container-shadow-2);
            border: 1px solid var(--border-color);
        }

        .btn-icon:hover {
            transform: translateY(-2px) scale(1.05);
        }

        .btn-icon:active {
            transform: scale(0.92);
            box-shadow: inset 3px 3px 6px var(--container-shadow-1),
                inset -3px -3px 6px var(--container-shadow-2);
        }

        .btn-icon-edit:hover {
            color: var(--btn-success);
        }

        .btn-icon-delete:hover {
            color: var(--btn-danger, #f72585);
        }

        /* ============================================================
       MODAL - TRANSICIONES CINEMATOGRÁFICAS CON RELIEVE
       ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
            pointer-events: none;
            transition: all 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0;
        }

        .modal-overlay.active {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            pointer-events: all;
            opacity: 1;
        }

        body.light-mode .modal-overlay.active {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .modal-content {
            background: var(--container-bg);
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 1100px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 9px 9px 18px var(--container-shadow-1),
                -9px -9px 18px var(--container-shadow-2);
            border: 1px solid var(--border-color);
            transform: scale(0.92) translateY(30px);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
            opacity: 1;
            transition-delay: 0.1s;
        }

        body.light-mode .modal-content {
            box-shadow: 9px 9px 18px var(--container-shadow-1),
                -9px -9px 18px var(--container-shadow-2);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .modal-content::-webkit-scrollbar {
            width: 4px;
        }

        .modal-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }

        body.light-mode .modal-content::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.08);
        }

        .modal-content::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        body.light-mode .modal-content::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.15);
        }

        /* ============================================================
       MODAL - TÍTULO Y ANIMACIONES
       ============================================================ */
        .modal-content h2 {
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: -0.02em;
            opacity: 0;
            transform: translateY(-15px) scale(0.95);
            animation: titleIn 0.6s ease 0.2s forwards;
        }

        @keyframes titleIn {
            0% {
                opacity: 0;
                transform: translateY(-15px) scale(0.95);
            }

            60% {
                transform: translateY(3px) scale(1.02);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-content h2 .icon {
            display: inline-block;
            animation: iconPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
            opacity: 0;
            transform: scale(0.3) rotate(-20deg);
        }

        @keyframes iconPop {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(-20deg);
            }

            60% {
                transform: scale(1.2) rotate(5deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            justify-content: flex-end;
            opacity: 0;
            transform: translateY(15px);
            animation: sectionIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.45s forwards;
        }

        @keyframes sectionIn {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            60% {
                transform: translateY(-3px) scale(1.005);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ============================================================
       FORMULARIO DEL MODAL - GRID 3 COLUMNAS CON RELIEVE
       ============================================================ */
        .modal-content .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .modal-content .form-group {
            margin-bottom: 0.5rem;
        }

        .modal-content .form-group.full-width {
            grid-column: 1 / -1;
        }

        .modal-content .form-group.half-width {
            grid-column: span 2;
        }

        .modal-content .form-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem 1.8rem;
            margin-bottom: 1.2rem;
            border: 1px solid var(--border-color);
            box-shadow: 4px 4px 8px var(--container-shadow-1),
                -4px -4px 8px var(--container-shadow-2);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            animation: sectionIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .modal-content .form-section:nth-child(1) {
            animation-delay: 0.15s;
        }

        .modal-content .form-section:nth-child(2) {
            animation-delay: 0.25s;
        }

        .modal-content .form-section:nth-child(3) {
            animation-delay: 0.35s;
        }

        .modal-content .form-section-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.6rem;
        }

        .modal-content .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--label-color);
            margin-bottom: 0.3rem;
            transition: color 0.3s ease;
        }

        .modal-content .form-group input,
        .modal-content .form-group select {
            width: 100%;
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: inset 4px 4px 8px var(--input-shadow-1),
                inset -4px -4px 8px var(--input-shadow-2);
        }

        .modal-content .form-group input:focus,
        .modal-content .form-group select:focus {
            outline: none;
            background: var(--input-focus-bg);
            box-shadow: inset 2px 2px 5px var(--input-shadow-1),
                inset -2px -2px 5px var(--input-shadow-2),
                0 0 0 3px rgba(67, 97, 238, 0.15);
        }

        .modal-content .form-group input::placeholder {
            color: var(--text-muted-light);
        }

        .modal-content .form-group select option {
            background: var(--select-option-bg);
            color: var(--text-primary);
        }

        .modal-content .checkbox-group {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            padding-top: 0.3rem;
        }

        .modal-content .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 400;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .modal-content .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            box-shadow: none;
            accent-color: var(--btn-primary);
        }

        .modal-content .helper-text {
            font-size: 0.7rem;
            color: var(--text-muted-light);
            margin-top: 0.2rem;
        }

        /* ============================================================
       ESTADOS
       ============================================================ */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            border-top-color: var(--btn-primary);
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted-light);
            font-size: 0.95rem;
        }

        .error {
            color: var(--error-color, #f72585);
            text-align: center;
            margin-top: 0.5rem;
            font-weight: 500;
            transition: color 0.3s ease;
            padding: 0.5rem;
            border-radius: 12px;
            background: rgba(247, 37, 133, 0.08);
            box-shadow: inset 2px 2px 4px rgba(247, 37, 133, 0.05);
        }

        .success-msg {
            color: var(--btn-success);
            text-align: center;
            margin-top: 0.5rem;
            font-weight: 500;
            transition: color 0.3s ease;
            padding: 0.5rem;
            border-radius: 12px;
            background: rgba(76, 201, 240, 0.08);
            box-shadow: inset 2px 2px 4px rgba(76, 201, 240, 0.05);
        }

        /* ============================================================
       FOOTER
       ============================================================ */
        .footer {
            text-align: center;
            padding: 0.8rem 0 0.3rem 0;
            color: var(--footer-color);
            font-size: 0.75rem;
            flex-shrink: 0;

        /* ============================================================
       RESPONSIVE

        @media (max-width: 1200px) {
            .modal-content {

                padding: 2rem;

            .modal-content .form-grid {

            }

        @media (max-width: 992px) {

            }

            .modal-content .checkbox-group {

            }

            .modal-actions {
                flex-direction: column;
            }

            .modal-actions .btn {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {

                padding: 0.5rem;
            }

            .censo-container {

            .modal-content .form-section {
                padding: 0.6rem 0.8rem;
            }

            .modal-content .form-group input,
            .modal-content .form-group select {
                padding: 0.5rem 0.7rem;
                font-size: 0.8rem;
            }

            .modal-content .form-group label {
                font-size: 0.75rem;
            }

            .modal-content .checkbox-group label {
                font-size: 0.75rem;
            }

                font-size: 1.1rem;
            }

        @media (max-height: 700px) {
            .censo-container {
                height: calc(100vh - 2rem);

            }

            .modal-content {

            .modal-content .form-section {

            }

            .modal-content .form-grid {

            }

            .modal-content h2 {
                font-size: 1.2rem;
                margin-bottom: 0.8rem;
            }

            .modal-content .form-group input,
            .modal-content .form-group select {
                padding: 0.5rem 0.8rem;

            }

            .modal-actions {
                margin-top: 0.8rem;
                padding-top: 0.5rem;
                border-top: 1px solid var(--border-color);
            }
        }
    </style>

</head>

<body>

    <div class="particles" id="particles"></div>

    <div class="censo-container">
        <button class="theme-toggle" id="themeToggle" type="button" title="Cambiar tema">🌙</button>

        <div class="censo-header">
            <div>
                <h1>📋 Censo de Cartillas</h1>
                <p class="subtitle">Registro de personas que reciben cartillas</p>
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">
                    ← Volver
                </button>
                <button class="btn btn-success" onclick="abrirModal()">
                    + Nuevo Registro
                </button>
            </div>
        </div>

        <div id="userInfo" style="display:none;">
            <div class="user-badge">
                <span id="userNameDisplay">👤 Cargando...</span>
                <span class="badge-rol" id="userRolDisplay">usuario</span>
                <span id="userCentroDisplay" style="color:var(--text-muted-light); font-size:0.8rem;"></span>
            </div>
        </div>

        <div class="search-bar">
            <div class="search-input-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Buscar por nombre, CURP o folio..."
                    oninput="cargarCenso()" autocomplete="off" />
            </div>
            <span class="info" id="totalRegistros">0 registros</span>
        </div>

        <div class="table-container" id="censoContainer">
            <div class="empty-state">
                <div class="loading-spinner"></div>
                Cargando registros...
            </div>
        </div>

        <div id="error" class="error"></div>
        <div id="success" class="success-msg"></div>

        <div class="footer">
            Sistema de Cartillas de Salud © <span id="currentYear"></span>
        </div>
    </div>

    <!-- ============================================================
    MODAL FORMULARIO
    ============================================================ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h2 id="modalTitle"><span class="icon">📝</span> Nuevo Registro</h2>
            <form id="censoForm" onsubmit="guardarCenso(event)">
                <input type="hidden" id="editId" value="" />

                <!-- DATOS PERSONALES -->
                <div class="form-section">
                    <div class="form-section-title">👤 Datos Personales</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="nombre">Nombre *</label>
                            <input type="text" id="nombre" placeholder="Nombre" required />
                        </div>
                        <div class="form-group">
                            <label for="paterno">Apellido Paterno *</label>
                            <input type="text" id="paterno" placeholder="Apellido Paterno" required />
                        </div>
                        <div class="form-group">
                            <label for="materno">Apellido Materno</label>
                            <input type="text" id="materno" placeholder="Apellido Materno" />
                        </div>
                        <div class="form-group">
                            <label for="curp">CURP *</label>
                            <input type="text" id="curp" placeholder="CURP (18 caracteres)" required maxlength="18"
                                oninput="procesarCurp(this.value)" />
                            <div class="helper-text">💡 Sexo, fecha, edad y entidad se detectan automáticamente</div>
                        </div>
                        <div class="form-group">
                            <label for="fecha_nac">Fecha de Nacimiento *</label>
                            <input type="date" id="fecha_nac" required onchange="calcularEdad()" />
                        </div>
                        <div class="form-group">
                            <label for="edad">Edad</label>
                            <input type="number" id="edad" placeholder="Edad" readonly />
                        </div>
                        <div class="form-group">
                            <label for="sexo">Sexo *</label>
                            <select id="sexo" required>
                                <option value="">Seleccionar...</option>
                                <option value="H">Hombre</option>
                                <option value="M">Mujer</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="fecha_entrega">Fecha de Entrega *</label>
                            <input type="date" id="fecha_entrega" required />
                        </div>
                    </div>
                </div>

                <!-- UBICACIÓN -->
                <div class="form-section">
                    <div class="form-section-title">📍 Ubicación y Población</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="entidad">Entidad *</label>
                            <select id="entidad" required onchange="cargarMunicipios()">
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="municipio">Municipio *</label>
                            <select id="municipio" required>
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="clues">Centro de Salud (CLUES) *</label>
                            <select id="clues" required>
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="pais">País</label>
                            <select id="pais">
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>
                    </div>
                    <div class="checkbox-group" style="margin-top:0.75rem;">
                        <label><input type="checkbox" id="pob_indigena" /> Población Indígena</label>
                        <label><input type="checkbox" id="pob_afromex" /> Afromexicano</label>
                        <label><input type="checkbox" id="pob_migrante" /> Migrante</label>
                    </div>
                </div>

                <!-- DATOS CARTILLA -->
                <div class="form-section">
                    <div class="form-section-title">📋 Datos de la Cartilla</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="tipo_cartilla">Tipo de Cartilla *</label>
                            <select id="tipo_cartilla" required>
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="motivo_entrega">Motivo de Entrega *</label>
                            <select id="motivo_entrega" required>
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="agno_edicion">Año de Edición *</label>
                            <select id="agno_edicion" required>
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="servicio_entrega">Servicio que Entrega *</label>
                            <select id="servicio_entrega" required>
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="se_proporciono_info">¿Se proporcionó información? *</label>
                            <select id="se_proporciono_info" required>
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="discapacidad">Discapacidad</label>
                            <select id="discapacidad">
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="embarazo">Embarazo</label>
                            <select id="embarazo">
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="tipo_migracion">Tipo de Migración</label>
                            <select id="tipo_migracion">
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>
                        <div class="form-group full-width">
                            <label for="especificar_otro">Especificar otro (si aplica)</label>
                            <input type="text" id="especificar_otro" placeholder="Especificar..." />
                        </div>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Guardar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============================================================
        // TEMA DIURNO / NOCTURNO
        // ============================================================
        (function setupTheme() {
            var body = document.body;
            var themeToggle = document.getElementById('themeToggle');
            var icon = themeToggle;

            var savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                body.classList.add('light-mode');
                icon.textContent = '☀️';
            } else {
                icon.textContent = '🌙';
            }

            themeToggle.addEventListener('click', function () {
                var isLight = body.classList.toggle('light-mode');
                if (isLight) {
                    icon.textContent = '☀️';
                    localStorage.setItem('theme', 'light');
                } else {
                    icon.textContent = '🌙';
                    localStorage.setItem('theme', 'dark');
                }
            });
        })();

        // ============================================================
        // PARTÍCULAS
        // ============================================================
        function createParticles() {
            var container = document.getElementById('particles');
            for (var i = 0; i < 15; i++) {
                var p = document.createElement('div');
                p.classList.add('particle');
                var size = Math.random() * 10 + 5;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.bottom = '-' + size + 'px';
                p.style.animationDuration = Math.random() * 20 + 10 + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                p.style.opacity = Math.random() * 0.5 + 0.1;
                container.appendChild(p);
            }
        }

        // ============================================================
        // CONFIGURACIÓN DE SUPABASE
        // ============================================================
        var SUPABASE_URL = 'https://apsvmojzniglbpmmaugd.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_m9qYl2tQZMAou80wO2g66Q_VUzkf3n1';
        var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // ELEMENTOS DEL DOM
        // ============================================================
        var censoContainer = document.getElementById('censoContainer');
        var errorElement = document.getElementById('error');
        var successElement = document.getElementById('success');
        var totalRegistros = document.getElementById('totalRegistros');
        var searchInput = document.getElementById('searchInput');

        var modalOverlay = document.getElementById('modalOverlay');
        var modalTitle = document.getElementById('modalTitle');
        var editId = document.getElementById('editId');
        var submitBtn = document.getElementById('submitBtn');

        // ============================================================
        // USUARIO LOGUEADO
        // ============================================================
        var usuarioActual = null;

        async function getUsuarioActual() {
            try {
                var session = await supabaseClient.auth.getSession();
                if (!session.data.session) {
                    window.location.href = 'login.html';
                    return null;
                }

                var authUserId = session.data.session.user.id;
                var userEmail = session.data.session.user.email;

                var result = await supabaseClient
                    .from('usuario')
                    .select(
                        'id_uuid, nombre, paterno, materno, rol, clues_id_uuid, clues:clues_id_uuid (id_uuid, clues, nombre)'
                    )
                    .eq('auth_user_id', authUserId);

                if (result.data && result.data.length > 0) {
                    usuarioActual = result.data[0];
                    return usuarioActual;
                }

                usuarioActual = {
                    id_uuid: authUserId,
                    nombre: userEmail,
                    paterno: '',
                    materno: '',
                    rol: 'usuario',
                    clues_id_uuid: null,
                    clues: null
                };
                return usuarioActual;

            } catch (error) {
                console.error('Error al obtener usuario:', error);
                return null;
            }
        }

        async function mostrarUsuario() {
            var user = await getUsuarioActual();
            if (!user) return;

            var infoDiv = document.getElementById('userInfo');
            var nameDisplay = document.getElementById('userNameDisplay');
            var rolDisplay = document.getElementById('userRolDisplay');
            var centroDisplay = document.getElementById('userCentroDisplay');

            var nombreCompleto = user.nombre || 'Usuario';
            if (user.paterno) nombreCompleto += ' ' + user.paterno;
            if (user.materno) nombreCompleto += ' ' + user.materno;

            nameDisplay.textContent = '👤 ' + nombreCompleto;
            rolDisplay.textContent = user.rol || 'usuario';

            if (user.clues && user.clues.nombre) {
                centroDisplay.textContent = '🏥 ' + user.clues.nombre;
            } else {
                centroDisplay.textContent = 'Sin centro asignado';
            }

            infoDiv.style.display = 'block';
        }

        // ============================================================
        // DATOS DE RESPALDO COMPLETOS
        // ============================================================
        var DATOS_FALLBACK = {
            entidad: [
                { id_uuid: 'ent-01', entidad: 'Aguascalientes' },
                { id_uuid: 'ent-02', entidad: 'Baja California' },
                { id_uuid: 'ent-03', entidad: 'Baja California Sur' },
                { id_uuid: 'ent-04', entidad: 'Campeche' },
                { id_uuid: 'ent-05', entidad: 'Coahuila' },
                { id_uuid: 'ent-06', entidad: 'Colima' },
                { id_uuid: 'ent-07', entidad: 'Chiapas' },
                { id_uuid: 'ent-08', entidad: 'Chihuahua' },
                { id_uuid: 'ent-09', entidad: 'Ciudad de México' },
                { id_uuid: 'ent-10', entidad: 'Durango' },
                { id_uuid: 'ent-11', entidad: 'Guanajuato' },
                { id_uuid: 'ent-12', entidad: 'Guerrero' },
                { id_uuid: 'ent-13', entidad: 'Hidalgo' },

        // ============================================================
        // FUNCIÓN PARA CARGAR CATÁLOGO CON FALLBACK - MEJORADA
        // ============================================================
        async function cargarCatalogo(idSelect, tabla, campoTexto) {
            try {
                console.log(`🔄 Cargando ${idSelect} desde tabla "${tabla}"...`);
                var select = document.getElementById(idSelect);
                if (!select) {
                    console.warn(`⚠️ Select "${idSelect}" no encontrado`);
                    return false;
                }

                // Intentar cargar desde Supabase
                var result = await supabaseClient.from(tabla).select(`id_uuid, ${campoTexto}`).order(campoTexto);

                if (result.data && result.data.length > 0) {
                    select.innerHTML = '<option value="">Seleccionar...</option>';
                    result.data.forEach(function (item) {
                        var valor = item[campoTexto] || 'Sin nombre';
                        select.innerHTML += `<option value="${item.id_uuid}">${valor}</option>`;
                    });
                    console.log(`✅ ${idSelect} cargados desde BD:`, result.data.length);
                    return true;
                }

                // Si no hay datos en la BD, usar fallback
                console.warn(`⚠️ No hay datos en "${tabla}", usando fallback para ${idSelect}`);
                if (DATOS_FALLBACK[idSelect]) {
                    select.innerHTML = '<option value="">Seleccionar...</option>';
                    DATOS_FALLBACK[idSelect].forEach(function (item) {
                        var valor = item[campoTexto] || item[Object.keys(item)[1]] || 'Sin nombre';
                        select.innerHTML += `<option value="${item.id_uuid}">${valor}</option>`;
                    });
                    console.log(`✅ ${idSelect} cargados desde fallback:`, DATOS_FALLBACK[idSelect].length);
                    return true;
                } else {
                    console.warn(`⚠️ No hay datos de respaldo para ${idSelect}`);
                    return false;
                }

            } catch (error) {
                console.error(`❌ Error cargando ${idSelect}:`, error);
                // Intentar usar fallback
                var select = document.getElementById(idSelect);
                if (select && DATOS_FALLBACK[idSelect]) {
                    select.innerHTML = '<option value="">Seleccionar...</option>';
                    DATOS_FALLBACK[idSelect].forEach(function (item) {
                        var valor = item[campoTexto] || item[Object.keys(item)[1]] || 'Sin nombre';
                        select.innerHTML += `<option value="${item.id_uuid}">${valor}</option>`;
                    });
                    console.log(`✅ ${idSelect} cargados desde fallback (error)`);
                    return true;
                }
                return false;
            }
        }

        // ============================================================
        // CÁLCULO DE EDAD Y SUGERENCIA DE TIPO DE CARTILLA
        // ============================================================
        function calcularEdad() {
            var fechaNacInput = document.getElementById('fecha_nac');
            var edadInput = document.getElementById('edad');
            var sexoSelect = document.getElementById('sexo');
            var tipoCartillaSelect = document.getElementById('tipo_cartilla');

            if (!fechaNacInput || !edadInput) return;

            var fechaNac = fechaNacInput.value;
            if (fechaNac) {
                var nac = new Date(fechaNac);
                if (!isNaN(nac.getTime())) {
                    var hoy = new Date();
                    var edad = hoy.getFullYear() - nac.getFullYear();
                    var m = hoy.getMonth() - nac.getMonth();
                    if (m < 0 || (m === 0 && hoy.getDate() < nac.getDate())) {
                        edad--;
                    }
                    edadInput.value = edad;

                    var sexo = sexoSelect.value;
                    if (sexo && !isNaN(edad)) {
                        var sugerencia = sugerirTipoCartilla(edad, sexo);
                        if (sugerencia) {
                            var opciones = tipoCartillaSelect.options;
                            for (var i = 0; i < opciones.length; i++) {
                                if (opciones[i].text === sugerencia) {
                                    tipoCartillaSelect.value = opciones[i].value;
                                    break;
                                }
                            }
                        }
                        actualizarRestriccionesEmbarazo(sexo, edad);
                    }
                }
            }
        }

        function sugerirTipoCartilla(edad, sexo) {
            if (edad === null || edad === undefined || isNaN(edad)) return null;
            if (!sexo) return null;

            if (edad >= 0 && edad <= 9) return 'NIÑAS Y NIÑOS';
            if (edad >= 10 && edad <= 19) return 'ADOLESCENTES';
            if (edad >= 20 && edad <= 59) {
                if (sexo === 'H') return 'HOMBRES';
                if (sexo === 'M') return 'MUJERES';
            }
            if (edad >= 60) return 'ADULTO MAYOR';
            return null;
        }

        // ============================================================
        // ACTUALIZAR RESTRICCIONES DE EMBARAZO - CRÍTICO
        // ============================================================
        function actualizarRestriccionesEmbarazo(sexo, edad) {
            var embarazoSelect = document.getElementById('embarazo');
            if (!embarazoSelect) {
                console.warn('⚠️ Select de embarazo no encontrado');
                return;
            }

            // Esperar a que el select tenga opciones
            if (embarazoSelect.options.length <= 1) {
                setTimeout(function () {
                    actualizarRestriccionesEmbarazo(sexo, edad);
                }, 500);
                return;
            }

            // Buscar el valor "No"
            var noValue = '';
            var siValue = '';
            for (var i = 0; i < embarazoSelect.options.length; i++) {
                var text = embarazoSelect.options[i].text.toLowerCase().trim();
                if (text === 'no') {
                    noValue = embarazoSelect.options[i].value;
                }
                if (text === 'sí' || text === 'si') {
                    siValue = embarazoSelect.options[i].value;
                }
            }

            // Si no encuentra "No" o "Sí", usar el primer y segundo valor después del placeholder
            if (!noValue && embarazoSelect.options.length > 1) {
                noValue = embarazoSelect.options[1].value;
            }
            if (!siValue && embarazoSelect.options.length > 2) {
                siValue = embarazoSelect.options[2].value;
            }
            if (!siValue && embarazoSelect.options.length > 1) {
                siValue = embarazoSelect.options[1].value;
            }

            console.log(`🔍 Embarazo - Sexo: ${sexo || 'ninguno'}, Edad: ${edad || 'N/A'}, No: ${noValue}, Sí: ${siValue}`);

            // Si es hombre, deshabilitar y poner "No"
            if (sexo === 'H') {
                embarazoSelect.disabled = true;
                if (noValue) {
                    embarazoSelect.value = noValue;
                    console.log('👤 Hombre → Embarazo: "No" (deshabilitado)');
                }
                return;
            }

            // Si es mujer
            if (sexo === 'M') {
                // Edad fértil: 15-49 años
                if (edad >= 15 && edad <= 49) {
                    embarazoSelect.disabled = false;
                    if (noValue) {
                        embarazoSelect.value = noValue;
                    }
                    console.log(`👩 Mujer en edad fértil (${edad} años) → Embarazo habilitado, valor por defecto: "No"`);
                } else {
                    // Fuera de edad fértil - deshabilitar y poner "No"
                    embarazoSelect.disabled = true;
                    if (noValue) {
                        embarazoSelect.value = noValue;
                    }
                    console.log(`👩 Mujer fuera de edad fértil (${edad} años) → Embarazo: "No" (deshabilitado)`);
                }
                return;
            }

            // Si no hay sexo o edad, habilitar y poner "No" por defecto
            if (!sexo || !edad) {
                embarazoSelect.disabled = false;
                if (noValue) {
                    embarazoSelect.value = noValue;
                }
                console.log('⚠️ Sin sexo o edad definidos → Embarazo habilitado, valor: "No"');
            }
        }

        var entidadMap = {
            '01': 'Aguascalientes', '02': 'Baja California', '03': 'Baja California Sur',
            '04': 'Campeche', '05': 'Coahuila', '06': 'Colima', '07': 'Chiapas',
            '08': 'Chihuahua', '09': 'Ciudad de México', '10': 'Durango',
            '11': 'Guanajuato', '12': 'Guerrero', '13': 'Hidalgo',

            '29': 'Tlaxcala', '30': 'Veracruz', '31': 'Yucatán', '32': 'Zacatecas'
        };

        function obtenerNombreEntidad(clave) {
            if (!clave) return null;
            return entidadMap[clave] || null;
        }

        function validarCurp(curp) {
            if (!curp) return false;
            var curpLimpio = curp.trim().toUpperCase();
            var regex = /^[A-Z]{4}[0-9]{6}[A-Z]{6}[0-9]{2}$/;
            return regex.test(curpLimpio);
        }

        async function procesarCurp(curp) {
            if (!curp) return;

            console.log('🔍 Procesando CURP:', curp);

            var curpLimpio = curp.trim().toUpperCase();
            var entidadSelect = document.getElementById('entidad');
            var fechaNacInput = document.getElementById('fecha_nac');
            var edadInput = document.getElementById('edad');
            var sexoSelect = document.getElementById('sexo');
            var tipoCartillaSelect = document.getElementById('tipo_cartilla');

            // 1. DETECTAR SEXO
            if (curpLimpio.length >= 11) {
                var sexo = curpLimpio.charAt(10).toUpperCase();
                if (sexo === 'H' || sexo === 'M') {
                    sexoSelect.value = sexo;
                    var event = new Event('change');
                    sexoSelect.dispatchEvent(event);
                }
            }

            // 2. DETECTAR FECHA DE NACIMIENTO
            if (curpLimpio.length >= 17) {
                var anioStr = curpLimpio.substring(4, 6);
                var mesStr = curpLimpio.substring(6, 8);
                var diaStr = curpLimpio.substring(8, 10);

                var anio = parseInt(anioStr);
                var mes = parseInt(mesStr) - 1;
                var dia = parseInt(diaStr);

                var añoActual = new Date().getFullYear();
                var anioCompleto = (anio > (añoActual - 2000)) ? 1900 + anio : 2000 + anio;

                var fechaNac = new Date(anioCompleto, mes, dia);

                if (!isNaN(fechaNac.getTime())) {
                    var fechaStr = fechaNac.getFullYear() + '-' +
                        String(fechaNac.getMonth() + 1).padStart(2, '0') + '-' +
                        String(fechaNac.getDate()).padStart(2, '0');
                    fechaNacInput.value = fechaStr;
                    calcularEdad();
                }
            }

            // 3. DETECTAR ENTIDAD
            if (curpLimpio.length === 18) {
                var claveEntidad = curpLimpio.substring(11, 13);
                if (claveEntidad) {
                    var nombreEntidad = obtenerNombreEntidad(claveEntidad);
                    if (nombreEntidad && entidadSelect.options.length > 1) {
                        for (var i = 0; i < entidadSelect.options.length; i++) {
                            if (entidadSelect.options[i].text === nombreEntidad) {
                                entidadSelect.value = entidadSelect.options[i].value;
                                cargarMunicipios();
                                break;
                            }
                        }
                    }
                }

                // Validar CURP
                var curpInput = document.getElementById('curp');
                if (validarCurp(curpLimpio)) {
                    curpInput.style.borderColor = '#4cc9f0';
                    curpInput.style.boxShadow = '0 0 0 3px rgba(76, 201, 240, 0.2)';
                } else {
                    curpInput.style.borderColor = '#f72585';
                    curpInput.style.boxShadow = '0 0 0 3px rgba(247, 37, 133, 0.2)';
                }
            }
        }
